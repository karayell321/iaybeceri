<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İAY Beceri Takip Sistemi</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#1c2626;--mut:#617170;--line:#dde4e2;--pri:#0e4f54;--pri2:#13686e;--pri-soft:#e3efee;--acc:#c4362c;--ok:#1d7f48;--ok-soft:#e1f3e8;--bad:#c4362c;--bad-soft:#fbe6e4;--warn:#c9800c;--warn-soft:#fdf1dc}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit}
h1{font-size:22px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px}
.mut{color:var(--mut)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0e4f54 0%,#0a3437 100%);padding:16px}
.lbox{background:#fff;border-radius:14px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.lbox .logo{width:52px;height:52px;border-radius:12px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;margin-bottom:14px}
.lbox h2{margin:0 0 2px;font-size:20px}
.lbox p{margin:0 0 20px;color:var(--mut);font-size:13px}
.lbox label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.lbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.lbox .btn{width:100%;margin-top:20px;padding:11px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.lmode{font-size:12px;color:var(--mut);border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.lmode a{color:var(--pri);font-weight:600}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;padding:8px 16px;border-top:1px solid rgba(255,255,255,.08)}
.sync[hidden]{display:none}
.sync i{width:8px;height:8px;border-radius:50%;background:#7fd19b;display:inline-block}
.sync.busy i{background:#f0c24b}.sync.off i{background:#ef7b72}
/* layout */
#app{display:flex;min-height:100vh}
aside{width:236px;flex:none;background:#0b3d41;color:#cfe3e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:15px}
.brand span{font-size:12px;opacity:.7}
.clsbox{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.clsbox label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-bottom:5px}
.clsbox select{width:100%;background:#fff;color:var(--ink);border:0;border-radius:8px;padding:8px 10px;font-weight:600}
.clsbadge{display:inline-block;background:var(--pri-soft);color:var(--pri);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:3px}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.active{background:#fff;color:var(--pri);font-weight:600}
.nav .num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.nav button.active .num{background:var(--acc);color:#fff}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;padding:14px 12px 4px}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
main{flex:1;min-width:0;padding:24px 28px 60px}
.topbar{display:none}
.head{margin-bottom:18px}
.head p{margin:0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
.field input,.field select,.field textarea{font-weight:400;color:var(--ink)}
input[type=text],input[type=date],input[type=password],input:not([type]),input[type=number],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:-1px}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn.ghost{background:#fff;color:var(--pri);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--pri)}
.btn.danger{background:var(--acc);border-color:var(--acc)}
.btn.ghost.danger{background:#fff;color:var(--acc)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.tablewrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:8px}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{background:#f6f8f7;text-align:left;font-weight:600;color:var(--mut);position:sticky;top:0;z-index:1}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:#fafcfb}
.tbl .grp td{background:var(--pri-soft);font-weight:700;color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;color:var(--pri);line-height:1.1}
.kpi .l{font-size:12px;color:var(--mut);margin-top:4px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.mut{background:#eef1f0;color:var(--mut)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 42px;position:relative;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-weight:700;display:flex;align-items:center;justify-content:center}
.notice{background:var(--warn-soft);border:1px solid #f1d39c;color:#7a4e06;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
/* skill picker */
.grpcard{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.grphead{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f6f8f7;cursor:pointer;user-select:none}
.grphead b{flex:1}
.grphead .cnt{font-size:12px;color:var(--mut)}
.grphead .arr{transition:transform .15s}
.grpcard.open .arr{transform:rotate(90deg)}
.grpbody{display:none;padding:6px 12px 10px 38px;columns:2 300px;column-gap:24px}
.grpcard.open .grpbody{display:block}
.grpbody label{display:flex;gap:8px;padding:3px 0;break-inside:avoid;cursor:pointer;font-size:13px}
.grpbody label span.n{color:var(--mut);min-width:22px}
input[type=checkbox]{accent-color:var(--pri);width:16px;height:16px;flex:none;margin-top:1px}
.stulist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;columns:2 220px}
.stulist label{display:flex;gap:8px;padding:2px 0;font-size:13px;break-inside:avoid;cursor:pointer}
/* entry grid */
.gridwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.grid thead th{background:#f6f8f7;position:sticky;z-index:2}
.grid thead tr:first-child th{top:0}
.grid thead tr:nth-child(2) th{top:44px}
.grid th.sk{min-width:150px;max-width:180px;height:44px;padding:4px 6px;font-weight:600;font-size:11.5px;line-height:1.2;white-space:normal;border-left:2px solid #b9c6c3}
.grid th.att{width:36px;height:22px;font-weight:500;color:var(--mut);font-size:11px}
.grid th.att.f,.grid td.gc.f{border-left:2px solid #b9c6c3}
.grid .sticky{position:sticky;background:#fff;z-index:1}
.grid thead .sticky{z-index:3;background:#f6f8f7}
.grid .c1{left:0;min-width:84px;padding:4px 8px}
.grid .c2{left:84px;min-width:170px;padding:4px 8px;border-right:2px solid #b9c6c3}
.grid td.gc{width:36px;height:30px;text-align:center;font-weight:700;font-size:16px}
.gc.ed{cursor:pointer}
.gc.ed:hover{background:var(--pri-soft)}
.gc.prior.xs{background:#cfe9df;color:var(--ok);font-weight:700}
.grid td.gc{position:relative}
.grid td.gc[data-n]::before{content:attr(data-n) '.';position:absolute;top:1px;left:3px;font-size:9px;font-weight:600;color:#8a9694;line-height:1}
.gc.ed.rdy:not(.plus):not(.minus):not(.amb){background:#eaf6f0}
.o-an{position:absolute;left:0.5mm;top:0.2mm;font-size:6pt;font-weight:700;line-height:1;color:#333}
.gc.prior.xs::after{content:'✓';font-size:9px;vertical-align:super;margin-left:1px}
.grid th.ath{cursor:pointer;color:var(--pri);font-weight:700}
.grid th.ath:hover{background:var(--pri-soft);color:var(--pri)}
.grid th.ath small{display:block;font-size:9.5px;font-weight:600;line-height:1;opacity:.75}
.gc.plus{color:var(--ok);background:var(--ok-soft)}
.gc.minus{color:var(--bad);background:var(--bad-soft)}
.gc.amb{color:var(--warn);background:var(--warn-soft)}
.gc.prior{background:#eceeed;color:#6d7776;cursor:help}
.gc.prior.plus{color:#3e7d58}
.gc.prior.minus{color:#a35a54}
.gc.done{background:repeating-linear-gradient(45deg,#f1f3f2,#f1f3f2 4px,#e6e9e8 4px,#e6e9e8 8px)}
.gc.pend{box-shadow:inset 0 0 0 2px #e8b33c}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin:10px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
/* overlay & toast */
#overlay{position:fixed;inset:0;background:rgba(242,244,243,.97);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:600;color:var(--pri)}
#overlay.on{display:flex}
.spin{width:38px;height:38px;border:4px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1100;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#1c2626;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast div.e{background:var(--acc)}
/* scan */
.scancard canvas{width:100%;max-width:900px;border:1px solid var(--line);border-radius:8px;display:block}
.scanmeta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
/* charts */
.chartcard{position:relative}
.chartbox{position:relative;height:320px}
.chartbox.tall{height:auto}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ctl select{padding:5px 8px;font-size:13px}
/* render areas */
#render-area{position:fixed;left:0;top:0;z-index:5;background:#fff}
#print-area{display:none}
/* OMR page (mm layout) */
.omr-page{position:relative;width:297mm;height:210mm;background:#fff;color:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.omr-page>div{position:absolute;box-sizing:border-box}
.o-mk{background:#000}
.o-title{font-size:13pt;font-weight:700;text-align:center;letter-spacing:.03em}
.o-info{font-size:8pt;text-align:center;color:#333}
.o-meta{font-size:8.5pt;display:flex;justify-content:space-between;gap:8px;border-top:0.3mm solid #000;border-bottom:0.3mm solid #000;padding:1.2mm 0}
.o-c{border:0.2mm solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.o-hd{font-size:8pt;font-weight:700;text-align:center;background:#f0f0f0}
.o-sk{font-weight:700;text-align:center;line-height:1.15;padding:0.6mm 1mm;background:#f0f0f0}
.o-at{align-items:flex-start;font-size:6.5pt;font-weight:700;padding-top:0.5mm}
.o-pm{font-size:8pt;font-weight:700;text-align:center;line-height:1}
.o-no{font-size:7.5pt;justify-content:flex-start;padding-left:1mm}
.o-nm{font-size:7.5pt;justify-content:flex-start;padding-left:1.2mm;white-space:nowrap}
.o-prior{font-size:13pt;font-weight:700;color:#555;background:#e9e9e9}
.o-done{background:repeating-linear-gradient(45deg,#fff,#fff 1mm,#e0e0e0 1mm,#e0e0e0 1.6mm)}
.o-bb{border:0.25mm solid #444;background:#fff}
.o-sep{width:0.6mm;background:#000}
.o-code{background:#000}
.o-foot{font-size:6.5pt;line-height:1.25;color:#222}
.o-sign{font-size:8pt}
/* student card page */
.card-page{position:relative;width:210mm;height:297mm;background:#fff;color:#000;padding:14mm 13mm;font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}
.card-page h2{font-size:13pt;text-align:center;margin:0 0 1mm}
.card-page .sub{font-size:8.5pt;text-align:center;margin-bottom:4mm;color:#333}
.card-page .info{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 6mm;font-size:9pt;margin-bottom:4mm;border:0.3mm solid #000;padding:2.5mm 3mm}
.card-page table{border-collapse:collapse;width:100%;font-size:8pt}
.card-page th,.card-page td{border:0.2mm solid #000;padding:1.1mm 1.5mm;text-align:left}
.card-page th{background:#eee}
.card-page tr.g td{background:#dfe9e8;font-weight:700}
.card-page .pn{position:absolute;bottom:8mm;right:13mm;font-size:8pt}
/* giriş sekmeleri, rozetler, modal, ilerleme */
.ltabs{display:flex;background:#eef2f1;border-radius:9px;padding:3px;margin-bottom:4px}
.ltabs button{flex:1;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--mut)}
.ltabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbox select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.lbox a{color:var(--pri);font-weight:600;cursor:pointer}
.lalt{font-size:13px;text-align:center;margin-top:12px;color:var(--mut)}
.nav .bdg{margin-left:auto;background:var(--acc);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.nav button.active .bdg{background:var(--acc)}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0}.who b{color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who span{opacity:.65;font-size:11px}
.mwrap{position:fixed;inset:0;background:rgba(10,30,32,.45);z-index:1200;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbody .field{margin-bottom:10px}
.mbody input:not([type=checkbox]):not([type=radio]),.mbody select,.mbody textarea{width:100%}
.mbox a{color:var(--pri);font-weight:600}
.mbody .stulist label{align-items:center}
.pbar{height:8px;background:#e6ecea;border-radius:5px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.gprog{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:4px 12px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.gprog:last-child{border:0}
.heat td.h{text-align:center;font-size:12px;font-weight:600;min-width:62px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--mut)}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.empty{text-align:center;padding:28px;color:var(--mut)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.kpi.alert{border-color:#f1d39c;background:var(--warn-soft)}
.kpi.alert .v{color:var(--warn)}
textarea{resize:vertical}
.dots b{display:inline-block;width:18px;text-align:center}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .omr-page{page-break-after:always;break-after:page}
}
@media (max-width:860px){
  #app{flex-direction:column}
  aside{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s;height:100%}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;gap:12px;background:#0b3d41;color:#fff;padding:10px 16px;position:sticky;top:0;z-index:40}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;font-size:18px}
  main{padding:16px 16px 60px}
  .grpbody{padding-left:14px}
}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="logo">+</div>
    <h2>Beceri Takip Sistemi</h2>
    <p>KMÜ SHMYO · İlk ve Acil Yardım Programı</p>
    <div class="ltabs"><button type="button" data-lt="staff" class="on">Akademik Personel</button><button type="button" data-lt="student">Öğrenci</button></div>
    <form id="fStaff" autocomplete="off">
      <label for="lu">Kullanıcı adı</label><input id="lu" type="text" required autocapitalize="off">
      <label for="lp">Şifre</label><input id="lp" type="password" required>
      <button class="btn" type="submit">Personel girişi</button>
    </form>
    <form id="fStu" hidden autocomplete="off">
      <label for="sn">Okul numarası</label><input id="sn" type="text" inputmode="numeric" required>
      <label for="sp2">Şifre</label><input id="sp2" type="password" required>
      <button class="btn" type="submit">Öğrenci girişi</button>
      <div class="lalt">Hesabın yok mu? <a data-lt="register">Kayıt ol</a></div>
    </form>
    <form id="fReg" hidden autocomplete="off">
      <label for="rn">Okul numarası</label><input id="rn" type="text" inputmode="numeric" required>
      <label for="rname">Ad Soyad</label><input id="rname" type="text" required>
      <label for="rcls">Sınıf / grup</label><select id="rcls"></select>
      <label for="rp1">Şifre (en az 6 karakter)</label><input id="rp1" type="password" required minlength="6">
      <label for="rp2">Şifre (tekrar)</label><input id="rp2" type="password" required minlength="6">
      <button class="btn" type="submit">Kayıt ol</button>
      <div class="lalt">Zaten hesabın var mı? <a data-lt="student">Giriş yap</a></div>
    </form>
    <div class="err" id="lerr"></div>
    <div id="lmode" class="lmode"></div>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">

/* ===================== ŞİFRELEME (SHA-256) ===================== */
const SHA=(()=>{const P=[];for(let n=2;P.length<64;n++)if(P.every(p=>n%p))P.push(n);
 const fr=x=>(x-Math.floor(x))*4294967296|0;const K=P.map(p=>fr(Math.cbrt(p))),H0=P.slice(0,8).map(p=>fr(Math.sqrt(p)));
 return str=>{const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;const dv=new DataView(m.buffer);
  dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));const w=new Int32Array(64);let H=H0.slice();const r=(x,k)=>x>>>k|x<<(32-k);
  for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
   for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(c,17)^r(c,19)^(c>>>10)))|0;}
   let[a,bb,c,d,e,f,g,h]=H;
   for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
   H=[H[0]+a|0,H[1]+bb|0,H[2]+c|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+g|0,H[7]+h|0];}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');};})();
function hashPw(pw,salt){let h=salt+'|'+pw;for(let i=0;i<500;i++)h=SHA(h+salt);return h;}
function newSecret(pw){const salt=Math.random().toString(36).slice(2,12)+Date.now().toString(36);return{salt,hash:hashPw(pw,salt)};}

async function initCloud(){

function cloudSchedule(){clearTimeout(PUSH_T);setSync('busy','Bulut: kaydediliyor…');PUSH_T=setTimeout(()=>{PUSH_T=null;cloudPush();},350);}
async function cloudPush(){
 if(!CLOUD)return;const fs=CLOUD.fs,ops=[];
 // öğrenci oturumu ortak meta belgesine asla yazmaz (yalnızca kendi bildirim ve hesap belgelerine)
 if(ROLE!=='student'){const mj=metaOf(DB);if(mj!==LAST.meta)ops.push(['set',fs.collection('iay').doc('meta'),{json:mj,t:Date.now()},()=>LAST.meta=mj]);}
 COLS.forEach(([name,col])=>{const L=LAST[name];new Set([...Object.keys(DB[name]),...Object.keys(L)]).forEach(id=>{const j=colJSON(name,id);if(j===(L[id]??null))return;
  const ref=fs.collection(col).doc(id);
  if(j)ops.push(['set',ref,{json:j,t:Date.now()},()=>L[id]=j]);else ops.push(['del',ref,null,()=>delete L[id]]);});});
 if(!ops.length){if(!PENDING)setSync('','Bulut: kaydedildi');return;}
 ops.forEach(o=>o[3]());
 PENDING++;
 try{for(const part of chunk(ops,400)){const b=fs.batch();part.forEach(([t,ref,data])=>t==='set'?b.set(ref,data):b.delete(ref));await b.commit();}
  PENDING--;if(!PENDING)setSync('','Bulut: kaydedildi');}
 catch(e){PENDING--;console.error(e);LAST=emptyLast();setSync('off','Bulut: kaydedilemedi');toast('Buluta kaydedilemedi: '+(e.code||e.message)+'. İnternet bağlantınızı kontrol edin.',1);}
}
window.addEventListener('beforeunload',e=>{if(CLOUD&&(PENDING||PUSH_T)){e.preventDefault();e.returnValue='';}});
async function cloudLoad(){
 const fs=CLOUD.fs;
 const [m,...cs]=await Promise.all([fs.collection('iay').doc('meta').get(),...COLS.map(([,c])=>fs.collection(c).get())]);
 let settings={};try{settings=JSON.parse(localStorage.getItem(KEY+'_ayar'))||{};}catch(e){}
 LAST=emptyLast();
 if(!m.exists){
  const local=normalize((()=>{try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}})());
  if(local&&local.students.length&&confirm(`Bulutta henüz veri yok. Bu tarayıcıda kayıtlı ${local.students.length} öğrenci ve ${local.forms.length} form var.\n\nBunlar buluta aktarılsın mı?`)){
   DB=loadDB(local);DB.settings=Object.assign(DB.settings,settings);await cloudPush();toast('Veriler buluta aktarıldı');}
  else{DB=loadDB(Object.assign(defDB(),{settings:Object.assign(defDB().settings,settings)}));await cloudPush();}
 }else{
  const d=JSON.parse(m.data().json);LAST.meta=m.data().json;
  COLS.forEach(([name],i)=>{d[name]={};cs[i].forEach(doc=>{const j=doc.data().json;LAST[name][doc.id]=j;try{d[name][doc.id]=JSON.parse(j);}catch(e){}});});
  d.settings=Object.assign(defDB().settings,settings);DB=loadDB(d);
  if(metaOf(DB)!==LAST.meta)await cloudPush();
 }
 setSync('','Bulut: kaydedildi');
 cloudListen();
}
function cloudListen(){
 UNSUB.forEach(u=>u());UNSUB=[];const fs=CLOUD.fs;
 let first=true;
 UNSUB.push(fs.collection('iay').doc('meta').onSnapshot(s=>{if(first){first=false;return;}if(s.metadata.hasPendingWrites||!s.exists)return;const j=s.data().json;if(j===LAST.meta)return;
  LAST.meta=j;const x=JSON.parse(j);Object.assign(DB,{classes:x.classes||[],students:x.students||[],forms:x.forms||[],customCourses:x.customCourses||[],users:x.users||DB.users,audit:x.audit||[],seq:Object.assign(DB.seq,x.seq||{})});
  if(!DB.classes.find(c=>c.id===DB.settings.activeClass))DB.settings.activeClass=DB.classes.length?DB.classes[DB.classes.length-1].id:'';remoteRefresh();},e=>{console.error(e);setSync('off','Bulut: bağlantı yok');}));

function parseStudentRows(rows){
 rows=rows.map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(c=>c));
 if(!rows.length)return[];
 const norm=s=>s.toLocaleLowerCase('tr-TR').replace(/\s+/g,' ');
 let hi=-1,noC=-1,nameC=-1,adC=-1,soyC=-1;
 for(let i=0;i<Math.min(6,rows.length);i++){const r=rows[i].map(norm);
  const n=r.findIndex(c=>/(numara|öğrenci no|ogrenci no|^no\.?$|okul no|öğr\.? ?no)/.test(c));
  const nm=r.findIndex(c=>/(ad[ıi]? ?soyad|isim|ad-soyad|ad \/ soyad)/.test(c));
  const ad=r.findIndex(c=>/^(ad[ıi]?|isim)$/.test(c));const so=r.findIndex(c=>/^soyad[ıi]?$/.test(c));
  if(n>=0||nm>=0||(ad>=0&&so>=0)){hi=i;noC=n;nameC=nm;adC=ad;soyC=so;break;}}
 const data=hi>=0?rows.slice(hi+1):rows;
 if(hi<0){const numeric=/\d{3,}/.test(data[0][0]||'');noC=numeric?0:-1;nameC=numeric?1:0;
  if(numeric&&data[0].length>=3&&data[0][2]&&!/\d/.test(data[0][2])&&data.every(r=>(r[1]||'').split(' ').length===1)){nameC=-1;adC=1;soyC=2;}}
 const out=[];let auto=0;const seen=new Set();
 data.forEach(r=>{let name=nameC>=0?r[nameC]:[r[adC]||'',r[soyC]||''].join(' ').trim();let no=noC>=0?r[noC]:'';
  if(!name)return;if(!no)no='OTO-'+(++auto);if(seen.has(no))return;seen.add(no);out.push({no,name:name.replace(/\s+/g,' ')});});
 return out;
}

/* ===================== FORM DURUM HESABI ===================== */
function baseRec(form,sid,k){return rec(sid,k).map(x=>x&&x.f!==form.id?x:null);}
// Formdaki 4 sütun: önceki denemeleri 4'e sığan öğrencide 1.–4. deneme (önceki sonuçlar gri),
// 4 ve daha fazla önceki denemesi olanda son iki deneme gri + sıradaki iki deneme boş gösterilir
function firstFree(form,sid,k){const a=rec(sid,k),F=a.findIndex(x=>!x||x.f===form.id);return F<0?a.length:F;}
function winStart(form,sid,k){const F=firstFree(form,sid,k);return F<=3?0:F-2;}
function readyInfo(form,sid,k){const b=baseRec(form,sid,k),i=successIdx(b);return i>=0?{i,x:b[i]}:null;}
function printStates(form,sid,k){const W=winStart(form,sid,k),b=baseRec(form,sid,k);while(b.length<W+4)b.push(null);
 const r=[0,1,2,3].map(j=>{const x=b[W+j];return x?{type:'prior',r:x.r,x,g:W+j}:{type:'bubble',g:W+j};});r.W=W;return r;}
function legacyTypes(form,sid,k){const b=baseRec(form,sid,k),bs=successIdx(b);return [0,1,2,3].map(i=>b[i]?'p':bs>=0&&i>bs?'d':'b').join('');}
function formPages(f){const studs=f.studentIds.filter(stu);const sk=chunk(f.skillIds,f.spp),st=chunk(studs,f.rpp);const out=[];
 sk.forEach(s=>st.forEach(t=>out.push({skills:s,students:t})));out.forEach((p,i)=>{p.index=i;p.total=out.length;});return out;}
/* ---- dersler arası eşitleme ---- */
const srcLabel=x=>{const id=String(x.f||'');if(id[0]==='S')return'Öğrenci bildirimi';if(id[0]==='Q')return'Hızlı not girişi';const g=formById(id);return g?`Form #${g.num}`:'Önceki kayıt';};
function formElsewhere(f){const out=[];f.studentIds.filter(stu).forEach(sid=>f.skillIds.forEach(k=>{const a=rec(sid,k),si=successIdx(a);
 if(si>=0&&a[si].f!==f.id)out.push({sid,k,si,x:a[si],key:sid+'|'+k,conf:[]});}));return out;}
function formNew(f){if(!f.sync)return 0;const seen=new Set(f.sync);return formElsewhere(f).filter(o=>!seen.has(o.key)).length;}
function snapOf(f){const b={};f.studentIds.filter(stu).forEach(sid=>f.skillIds.forEach(k=>{const st=printStates(f,sid,k);b[sid+'|'+k]=st.W+':'+st.map(c=>c.type[0]).join('');}));return b;}
function markPrinted(f){f.snap={t:Date.now(),b:snapOf(f)};save();}
function formStale(f){if(!f.snap)return 0;const now=snapOf(f);return Object.keys(now).filter(k=>f.snap.b[k]&&f.snap.b[k]!==now[k]).length;}
const formsWithNews=()=>activeForms().filter(f=>formNew(f)>0);

 const fs=CLOUD.fs,[m,...cs]=await Promise.all([fs.collection('iay').doc('meta').get(),...COLS.map(([,c])=>fs.collection(c).get())]);
 if(m.exists){const j=m.data().json;if(j!==LAST.meta){LAST.meta=j;const x=JSON.parse(j);Object.assign(DB,{classes:x.classes||[],students:x.students||[],forms:x.forms||[],customCourses:x.customCourses||[],users:x.users||DB.users,audit:x.audit||[],seq:Object.assign(DB.seq,x.seq||{})});}}
 COLS.forEach(([name],i)=>{const L=LAST[name],seen=new Set();cs[i].forEach(doc=>{seen.add(doc.id);const j=doc.data().json;if(j!==L[doc.id]){L[doc.id]=j;try{DB[name][doc.id]=JSON.parse(j);}catch(e){}}});
  Object.keys(DB[name]).forEach(id=>{if(!seen.has(id)){delete L[id];delete DB[name][id];}});});

 const out=[0,1,2,3].map(j=>{const g=W+j,x0=a[g];
  if(x0&&x0.f!==form.id)return{cls:'prior '+(x0.r==='+'?'plus':'minus')+(ri&&g===ri.i?' xs':''),txt:x0.r==='+'?'+':'−',title:`${g+1}. deneme ${x0.r==='+'?'başarılı':'başarısız'} · ${x0.c} · ${fmtDate(x0.d)}${x0.e?' · '+x0.e:''}${String(x0.f||'')[0]==='S'?' · öğrenci bildirimi':''}${ri&&g===ri.i?' — beceriye bu kayıtla hazır oldu':''}`,ed:0,g};
  const key=sid+'|'+k+'|'+g;const x=pending&&key in pending?(pending[key]?{r:pending[key],pend:1}:null):x0;
  const rt=ri?` · Öğrenci bu beceriye ${ri.x.c||'başka bir derste'} ${ri.i+1}. denemede hazır oldu`:'';
  if(x)return{cls:'ed '+(x.r==='+'?'plus':x.r==='?'?'amb':'minus')+(x.pend?' pend':''),txt:x.r==='+'?'+':x.r==='?'?'?':'−',title:`${g+1}. deneme · değiştirmek için tıklayın${rt}`,ed:1,g};
  return{cls:'ed',txt:'',title:`${g+1}. deneme · tıklayın: + → − → boş${rt}`,ed:1,g};});
 out.W=W;out.rdy=!!ri;return out;}

/* ===================== OMR SAYFA DÜZENİ (mm) ===================== */
const PG={W:297,H:210,X0:20,X1:277,Y0:31,cNo:15,cName:47,h1:15,h2:8,rowH:7};
const MARKS=[[8,8],[281,8],[281,194],[8,194]];            // sol üst, sağ üst, sağ alt, sol alt
const MC=MARKS.map(([x,y])=>[x+4,y+4]);                     // işaret merkezleri
const ROWS_H=186-(PG.Y0+PG.h1+PG.h2),MAXR=Math.floor(ROWS_H/5);   // satır yüksekliği en az 5 mm → sayfada en fazla 26 öğrenci
function layoutFor(n,pages){n=Math.max(1,n);const rpp=Math.ceil(n/pages);const real=Math.ceil(n/rpp);return{ok:rpp<=MAXR,rpp,pages:real,rowH:Math.min(8,Math.floor(ROWS_H/rpp*10)/10)};}
function geom(spp,rh){rh=rh||PG.rowH;const sx=PG.X0+PG.cNo+PG.cName,bw=(PG.X1-sx)/spp,aw=bw/4;return{sx,bw,aw,rh,b:Math.min(aw*0.36,4.2,rh*0.62),top:PG.Y0+PG.h1+PG.h2};}

function loadImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('Görsel açılamadı'));img.src=URL.createObjectURL(file);});}
function solveLinear(A,b){const n=b.length;for(let i=0;i<n;i++){let mx=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[mx][i]))mx=r;[A[i],A[mx]]=[A[mx],A[i]];[b[i],b[mx]]=[b[mx],b[i]];
 if(Math.abs(A[i][i])<1e-12)return null;for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}
 const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}return x;}
function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}return solveLinear(A,b);}
function hmap(h,x,y){const w=h[6]*x+h[7]*y+1;return[(h[0]*x+h[1]*y+h[2])/w,(h[3]*x+h[4]*y+h[5])/w];}
function analyzeImage(img){
 const maxD=1800,sc=Math.min(1,maxD/Math.max(img.naturalWidth,img.naturalHeight));
 const W=Math.max(1,Math.round(img.naturalWidth*sc)),H=Math.max(1,Math.round(img.naturalHeight*sc));
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,W,H);
 const px=cx.getImageData(0,0,W,H).data,N=W*H,g=new Uint8Array(N);
 for(let i=0;i<N;i++)g[i]=(px[i*4]*299+px[i*4+1]*587+px[i*4+2]*114)/1000;
 const W1=W+1,I=new Float64Array(W1*(H+1));
 for(let y=0;y<H;y++){let row=0;for(let x=0;x<W;x++){row+=g[y*W+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+row;}}
 const r=Math.max(8,Math.round(Math.max(W,H)/28)),dark=new Uint8Array(N);
 for(let y=0;y<H;y++){const y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);for(let x=0;x<W;x++){const x0=Math.max(0,x-r),x1=Math.min(W,x+r+1);
  const mean=(I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0])/((x1-x0)*(y1-y0));const v=g[y*W+x];if(v<mean-Math.max(14,mean*0.2))dark[y*W+x]=1;}}
 // bağlı bileşenler
 const stack=new Int32Array(N),seen=new Uint8Array(N),comps=[];
 for(let i=0;i<N;i++){if(!dark[i]||seen[i])continue;let sp=0;stack[sp++]=i;seen[i]=1;let area=0,minx=W,maxx=0,miny=H,maxy=0,sx=0,sy=0;
  while(sp){const p=stack[--sp],x=p%W,y=(p-x)/W;area++;sx+=x;sy+=y;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
   if(x>0&&dark[p-1]&&!seen[p-1]){seen[p-1]=1;stack[sp++]=p-1;}if(x<W-1&&dark[p+1]&&!seen[p+1]){seen[p+1]=1;stack[sp++]=p+1;}
   if(y>0&&dark[p-W]&&!seen[p-W]){seen[p-W]=1;stack[sp++]=p-W;}if(y<H-1&&dark[p+W]&&!seen[p+W]){seen[p+W]=1;stack[sp++]=p+W;}}
  if(area>=25)comps.push({area,minx,maxx,miny,maxy,cx:sx/area,cy:sy/area});}
 const ms=Math.min(W,H);
 let cand=comps.filter(c=>{const bw=c.maxx-c.minx+1,bh=c.maxy-c.miny+1,fill=c.area/(bw*bh),asp=bw/bh;return fill>0.7&&asp>0.55&&asp<1.8&&Math.max(bw,bh)>=ms*0.008&&Math.max(bw,bh)<=ms*0.13;});
 cand.sort((a,b)=>b.area-a.area);
 if(cand.length)cand=cand.filter(c=>c.area>=cand[0].area*0.2).slice(0,12);

 if(cand.length<4)return res;
 let best=null,bestA=0;const n=cand.length;
 for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++){
  const q=[cand[a],cand[b],cand[c],cand[d]],mx=(q[0].cx+q[1].cx+q[2].cx+q[3].cx)/4,my=(q[0].cy+q[1].cy+q[2].cy+q[3].cy)/4;
  q.sort((p,s)=>Math.atan2(p.cy-my,p.cx-mx)-Math.atan2(s.cy-my,s.cx-mx));
  let ar=0;for(let i=0;i<4;i++){const p=q[i],s=q[(i+1)%4];ar+=p.cx*s.cy-s.cx*p.cy;}ar=Math.abs(ar)/2;
  if(ar>bestA){bestA=ar;best=q;}}
 if(!best||bestA<W*H*0.08)return res;
 let start=0;best.forEach((p,i)=>{if(p.cx+p.cy<best[start].cx+best[start].cy)start=i;});
 res.ok=true;res.quad=best;
 const frac=(h,rc,inset=0.22,k=11)=>{let c=0,t=0;for(let a=0;a<k;a++)for(let b=0;b<k;b++){const x=rc.x+rc.w*(inset+(1-2*inset)*(a+0.5)/k),y=rc.y+rc.h*(inset+(1-2*inset)*(b+0.5)/k);
  const[u,v]=hmap(h,x,y),xi=Math.round(u),yi=Math.round(v);if(xi<0||yi<0||xi>=W||yi>=H)continue;t++;if(dark[yi*W+xi])c++;}return t?c/t:0;};
 const tries=[];
 for(let rot=0;rot<4;rot++){const pts=[0,1,2,3].map(i=>{const p=best[(start+rot)%4];return null;});
  const dst=[0,1,2,3].map(i=>{const p=best[(start+rot+i)%4];return[p.cx,p.cy];});
  const h=homography(MC,dst);if(!h)continue;const bits=[];for(let i=0;i<24;i++)bits.push(frac(h,codeRect(i),0.2,7)>0.5?1:0);
  tries.push({rot,h,code:decode(bits)});}
 const good=tries.find(t=>t.code.valid);
 const pick=good||tries.find(t=>t.rot===0)||tries[0];
 if(!pick){res.ok=false;return res;}
 res.h=pick.h;res.code=pick.code;res.codeOk=!!good;res.frac=(rc,inset)=>frac(res.h,rc,inset);
 return res;
}
function decideMark(fp,fm){const T=0.2;
 if(fp<T&&fm<T)return'';if(fp>=T&&fm<T)return'+';if(fm>=T&&fp<T)return'-';
 if(fp>fm*1.6)return'+';if(fm>fp*1.6)return'-';return'?';}
function rectifiedCanvas(A,marks){
 const S=4,OW=PG.W*S,OH=PG.H*S,oc=document.createElement('canvas');oc.width=OW;oc.height=OH;const ox=oc.getContext('2d');const od=ox.createImageData(OW,OH);
 for(let y=0;y<OH;y++)for(let x=0;x<OW;x++){const[u,v]=hmap(A.h,(x+0.5)/S,(y+0.5)/S);const xi=Math.round(u),yi=Math.round(v),o=(y*OW+x)*4;
  if(xi>=0&&yi>=0&&xi<A.W&&yi<A.H){const s=(yi*A.W+xi)*4;od.data[o]=A.px[s];od.data[o+1]=A.px[s+1];od.data[o+2]=A.px[s+2];}else{od.data[o]=od.data[o+1]=od.data[o+2]=220;}od.data[o+3]=255;}
 ox.putImageData(od,0,0);ox.lineWidth=2.5;
 marks.forEach(m=>{const col=m.v==='+'?'#1d9e55':m.v==='-'?'#d23a2f':m.v==='?'?'#e39a0e':null;
  [m.r0,m.r1].forEach((r,w)=>{const sel=(w===0&&m.v==='+')||(w===1&&m.v==='-')||m.v==='?';ox.strokeStyle=sel&&col?col:'rgba(40,110,200,.35)';ox.lineWidth=sel&&col?3:1.2;ox.strokeRect((r.x-0.6)*S,(r.y-0.6)*S,(r.w+1.2)*S,(r.h+1.2)*S);});});

}

const AYLAR=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const monthLabel=m=>m?AYLAR[+m.slice(5,7)-1]+' '+m.slice(0,4):'Tarihsiz';
const srcOf=x=>x.f&&String(x.f)[0]==='S'?'Öğrenci bildirimi':'Form / ekran girişi';
function recFilter(flt){return x=>!!x&&(!flt.course||x.c===flt.course)&&(!flt.ev||x.e===flt.ev)&&(!flt.from||(x.d||'')>=flt.from)&&(!flt.to||(x.d||'')<=flt.to);}
function computeStats(flt){
 const ok=recFilter(flt),grp=flt.group?GROUPS.find(g=>g.id==flt.group):null;
 const skills=[];for(let k=1;k<=104;k++)if(!grp||(k>=grp.from&&k<=grp.to))skills.push(k);
 const NB=5,bk=i=>Math.min(i,NB-1);
 const S={attTot:[0,0,0,0,0],attPlus:[0,0,0,0,0],succAt:[0,0,0,0,0],pairs:0,completed:0,failed:0,totalAttempts:0,sumAtt:0,skill:{},student:{},group:{},course:{},byMonth:{},byEval:{},rows:[],nStudents:0};
 skills.forEach(k=>S.skill[k]={k,n:0,s:[0,0,0,0,0],fail:0,ongoing:0,sumAtt:0});
 GROUPS.forEach(g=>S.group[g.id]={g,n:0,done:0,first:0,firstN:0,possible:0,att:0,plus:0});
 DB.students.filter(st=>!flt.cls||st.cls===flt.cls).forEach(st=>{S.nStudents++;
  const ss=S.student[st.id]={st,n:0,done:0,first:0,firstN:0,sumAtt:0,attempts:0,g:{}};
  skills.forEach(k=>{const gid=groupOf(k).id,gr=S.group[gid];gr.possible++;
   const a=rec(st.id,k).map(x=>ok(x)?x:null);if(!a.some(x=>x))return;
   const si=successIdx(a);
   S.pairs++;ss.n++;const sk=S.skill[k];sk.n++;gr.n++;
   a.forEach((x,i)=>{if(!x)return;S.attTot[bk(i)]++;S.totalAttempts++;ss.attempts++;gr.att++;const p=x.r==='+';if(p){S.attPlus[bk(i)]++;gr.plus++;}
    const c=S.course[x.c]||(S.course[x.c]={n:0,plus:0,done:0});c.n++;if(p)c.plus++;if(i===si)c.done++;
    const mk=x.d?x.d.slice(0,7):'',mo=S.byMonth[mk]||(S.byMonth[mk]={n:0,plus:0,done:0});mo.n++;if(p)mo.plus++;if(i===si)mo.done++;
    const ek=x.e||'(belirtilmemiş)',ev=S.byEval[ek]||(S.byEval[ek]={n:0,plus:0,fN:0,fP:0,done:0,stu:new Set()});ev.n++;if(p)ev.plus++;if(i===0){ev.fN++;if(p)ev.fP++;}if(i===si)ev.done++;ev.stu.add(st.id);
    S.rows.push({sid:st.id,k,g:gid,i,r:x.r,c:x.c||'(belirtilmemiş)',e:ek,m:mk,src:srcOf(x),succ:i===si});});
   if(a[0]){ss.firstN++;gr.firstN++;if(a[0].r==='+'){ss.first++;gr.first++;}}
   if(si>=0){S.succAt[bk(si)]++;S.completed++;S.sumAtt+=si+1;sk.s[bk(si)]++;sk.sumAtt+=si+1;ss.done++;ss.sumAtt+=si+1;gr.done++;ss.g[gid]=(ss.g[gid]||0)+1;}
   else if(a.filter(x=>x).length>=4){S.failed++;sk.fail++;}else sk.ongoing++;});});
 S.firstRate=pct(S.attPlus[0],S.attTot[0]);S.overall=pct(S.completed,S.pairs);S.avgAtt=S.completed?Math.round(S.sumAtt/S.completed*100)/100:0;S.skills=skills;
 S.activeStu=Object.values(S.student).filter(x=>x.n).length;
 return S;
}

/* ---- grafik oluşturucu: satır verisinden toplu hesap ---- */
function dimKey(r,d){return d==='skill'?r.k:d==='group'?r.g:d==='student'?r.sid:d==='course'?r.c:d==='ev'?r.e:d==='month'?r.m:d==='att'?Math.min(r.i+1,5):r.src;}
function dimLabel(v,d){if(d==='skill'){const n=v+'. '+skillName(v);return n.length>44?n.slice(0,42)+'…':n;}if(d==='group'){const g=GROUPS.find(x=>x.id==v);return 'B'+v+' '+(g?g.name:'');}
 if(d==='student'){const s=stu(v);return s?s.name:v;}if(d==='month')return monthLabel(v);if(d==='att')return v>=5?'5. ve sonrası':v+'. deneme';return String(v);}
function dimOrder(d){if(d==='student'){const o=sortStudents(DB.students.slice()).map(s=>s.id);return(a,b)=>o.indexOf(a)-o.indexOf(b);}
 if(['skill','group','att'].includes(d))return(a,b)=>a-b;return(a,b)=>String(a).localeCompare(String(b),'tr');}
function aggregate(rows,dim,series){const M=new Map(),SK=new Set();
 rows.forEach(r=>{const k=dimKey(r,dim),s=series?dimKey(r,series):'_';SK.add(s);if(!M.has(k))M.set(k,new Map());const inner=M.get(k);
  if(!inner.has(s))inner.set(s,{n:0,plus:0,fN:0,fP:0,done:0,sumAtt:0,pairs:new Set(),stu:new Set()});const a=inner.get(s);
  a.n++;if(r.r==='+')a.plus++;if(r.i===0){a.fN++;if(r.r==='+')a.fP++;}if(r.succ){a.done++;a.sumAtt+=r.i+1;}a.pairs.add(r.sid+'|'+r.k);a.stu.add(r.sid);});
 return{M,SK:[...SK].sort(dimOrder(series||'src'))};}
function metricVal(a,m){if(!a)return 0;return m==='attempts'?a.n:m==='plus'?a.plus:m==='minus'?a.n-a.plus:m==='rate'?pct(a.plus,a.n):m==='first'?pct(a.fP,a.fN):m==='done'?a.done:m==='avg'?(a.done?Math.round(a.sumAtt/a.done*100)/100:0):m==='pairs'?a.pairs.size:a.stu.size;}
function mergeAcc(list){const o={n:0,plus:0,fN:0,fP:0,done:0,sumAtt:0,pairs:new Set(),stu:new Set()};list.forEach(a=>{['n','plus','fN','fP','done','sumAtt'].forEach(k=>o[k]+=a[k]);a.pairs.forEach(x=>o.pairs.add(x));a.stu.forEach(x=>o.stu.add(x));});return o;}
function buildChart(canvas,box,S,B){
 const{M,SK}=aggregate(S.rows,B.dim,B.series);let keys=[...M.keys()];
 const tot=k=>metricVal(mergeAcc([...M.get(k).values()]),B.metric);
 if(B.sort==='nat')keys.sort(dimOrder(B.dim));else keys.sort((a,b)=>B.sort==='desc'?tot(b)-tot(a):tot(a)-tot(b));
 if(+B.limit)keys=keys.slice(0,+B.limit);
 const mName=METRICS.find(x=>x[0]===B.metric)[1],dName=DIMS.find(x=>x[0]===B.dim)[1];
 const title=B.title||`${dName} bazında ${mName.toLocaleLowerCase('tr')}`;
 const circ=['pie','doughnut','polarArea'].includes(B.type),useSeries=B.series&&!circ;
 const labels=keys.map(k=>dimLabel(k,B.dim)),isPct=['rate','first'].includes(B.metric);
 let ds;
 if(useSeries){ds=SK.slice(0,10).map((s,i)=>({label:dimLabel(s,B.series),data:keys.map(k=>metricVal(M.get(k).get(s),B.metric)),backgroundColor:B.type==='radar'?PAL[i%PAL.length]+'22':PAL[i%PAL.length]+(B.type==='area'?'55':''),borderColor:PAL[i%PAL.length],borderRadius:3,tension:.3,fill:B.type==='area',pointRadius:3}));}
 else ds=[{label:mName,data:keys.map(tot),backgroundColor:circ?keys.map((_,i)=>PAL[i%PAL.length]+'dd'):B.type==='radar'?'rgba(14,79,84,.18)':B.type==='area'?'rgba(14,79,84,.25)':keys.map((_,i)=>B.type==='line'?COLORS.pri:PAL[0]),borderColor:circ?'#fff':COLORS.pri,borderRadius:3,tension:.3,fill:B.type==='area',pointRadius:3}];
 const horiz=B.type==='hbar';box.style.height=(horiz?Math.max(300,keys.length*(useSeries?Math.min(SK.length,10)*10+14:24)+90):circ?380:360)+'px';
 const type=horiz||B.type==='stack'?'bar':B.type==='area'?'line':B.type;
 const valAx={beginAtZero:true,max:isPct?100:undefined,stacked:B.type==='stack'&&!isPct,ticks:{callback:v=>isPct?'%'+v:v}},catAx={stacked:B.type==='stack',ticks:{autoSkip:false,font:{size:11}}};
 const opts={plugins:{title:{display:true,text:title,font:{size:14,weight:'600'},color:'#1c2626',padding:{bottom:12}},legend:{display:useSeries||circ,position:circ?'right':'bottom'},
  tooltip:{callbacks:{label:c=>{const v=c.raw;return `${c.dataset.label}: ${isPct?'%':''}${v}`;}}}}};
 if(type==='radar')opts.scales={r:{beginAtZero:true,max:isPct?100:undefined}};
 else if(!circ)opts.scales=horiz?{x:valAx,y:catAx}:{y:valAx,x:catAx};
 if(horiz)opts.indexAxis='y';
 if(!keys.length){box.innerHTML='<canvas id="'+canvas.id+'"></canvas><p class="mut" style="position:absolute;top:40%;width:100%;text-align:center">Veri yok</p>';return;}
 return mkChart(canvas,{type,data:{labels,datasets:ds},options:opts});
}

  let t=l.text;while(x.measureText(t).width>wPx-4&&t.length>4)t=t.slice(0,-2);if(t!==l.text)t=t.slice(0,-1)+'…';x.fillText(t,2,y);y+=l.size*1.55;});return{url:c.toDataURL('image/png'),w:wPx,h:h+8};}

function cardRows(sid){return SKILLS.map((n,i)=>{const k=i+1,a=rec(sid,k),si=successIdx(a),cnt=a.filter(x=>x).length,last=a.filter(x=>x).pop();
 let st,deneme='',date='',course='',ev='';
 if(si>=0){st='ok';deneme=String(si+1);date=a[si].d;course=a[si].c;ev=a[si].e;}
 else if(cnt){deneme=cnt+'';course=last.c;ev=last.e;st='warn';}else st='none';
 return{k,n,st,deneme,date,course,ev,a};});}
const stLabel={ok:['ok','Hazır'],warn:['warn','Devam ediyor'],none:['mut','Değerlendirilmedi']};

/* ===================== ÖĞRENCİ BİLDİRİMLERİ: ORTAK ===================== */
const subFid=s=>'S'+s.id;
function subConflict(s){const a=rec(s.sid,s.k),si=successIdx(a),me=subFid(s);
 if(si>=0&&a[si].f!==me)return `Beceri zaten ${si+1}. denemede tamamlanmış (${a[si].c||''} · ${fmtDate(a[si].d)})`;
 const x=a[s.att-1];if(x&&x.f!==me)return `${s.att}. deneme hücresi dolu (${x.r==='+'?'+':'−'} · ${x.c||''})`;
 for(let i=s.att;i<a.length;i++)if(a[i]&&a[i].f!==me)return `Sonraki denemelerde kayıt var (${i+1}. deneme)`;return '';}
function applySub(s){const me=subFid(s),a=rec(s.sid,s.k);
 for(let i=0;i<s.att-1;i++)if(!a[i])setSlot(s.sid,s.k,i,{r:'-',d:s.d,c:s.c,e:s.e,f:me});
 setSlot(s.sid,s.k,s.att-1,{r:'+',d:s.d,c:s.c,e:s.e,f:me});
 s.st='onay';s.dt=Date.now();s.du=ME.name;delete s.reason;}
function unapplySub(s){const me=subFid(s);rec(s.sid,s.k).forEach((x,i)=>{if(x&&x.f===me)setSlot(s.sid,s.k,i,null);});s.st='bekliyor';delete s.dt;delete s.du;delete s.reason;}

   <input id="apq" placeholder="Öğrenci, beceri, ders ara…" value="${esc(APF.q)}" style="width:200px"></div></div>
 ${APF.st==='bekliyor'&&list.length?`<div class="row" style="margin:12px 0 4px"><label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="apall"> Tümünü seç</label><span style="flex:1"></span><button class="btn sm" id="bulkok" disabled>Seçilenleri onayla</button><button class="btn ghost danger sm" id="bulkno" disabled>Seçilenleri reddet</button></div>`:''}
 <div class="tablewrap" style="margin-top:10px;max-height:none"><table class="tbl"><thead><tr>${APF.st==='bekliyor'?'<th style="width:30px"></th>':''}<th>Öğrenci</th><th>Beceri</th><th>Deneme</th><th>Uygulama</th><th>Öğretim elemanı</th><th>Bildirim</th><th>${APF.st==='bekliyor'?'Not / uyarı':'Karar'}</th><th style="width:200px"></th></tr></thead><tbody>
 ${list.length?list.map(s=>{const st=stu(s.sid),cf=s.st==='bekliyor'?subConflict(s):'';
  return `<tr>${APF.st==='bekliyor'?`<td><input type="checkbox" class="apchk" value="${s.id}"></td>`:''}<td><b>${esc(st.name)}</b><div class="mut" style="font-size:12px">${esc(st.no)} · ${esc(clsName(st.cls))}</div></td>
  <td>${s.k}. ${esc(skillName(s.k))}<div class="mut" style="font-size:12px">Mevcut: ${attDots(rec(s.sid,s.k))}</div></td><td style="white-space:nowrap"><b>${s.att}.</b> deneme <b style="color:var(--ok)">+</b></td>
  <td>${fmtDate(s.d)}<div class="mut" style="font-size:12px">${esc(s.c)}</div></td><td>${esc(s.e)}</td><td class="mut" style="font-size:12px;white-space:nowrap">${fmtTime(s.t)}</td>
  <td style="font-size:12.5px">${s.st==='bekliyor'?(s.note?`<div>“${esc(s.note)}”</div>`:'')+(cf?`<span class="chip warn" title="${esc(cf)}">⚠ ${esc(cf)}</span>`:''):`${subStChip(s)}<div class="mut" style="font-size:12px">${esc(s.du||'')} · ${fmtTime(s.dt)}</div>${s.reason?`<div style="font-size:12px">Gerekçe: ${esc(s.reason)}</div>`:''}`}</td>
  <td style="white-space:nowrap">${s.st==='bekliyor'?`<button class="btn sm" data-ok="${s.id}">Onayla</button> <button class="btn ghost sm" data-edit="${s.id}">Düzenle</button> <button class="btn ghost danger sm" data-no="${s.id}">Reddet</button>`:s.st==='onay'?`<button class="btn ghost sm" data-undo="${s.id}">Onayı geri al</button>`:`<button class="btn ghost sm" data-undo="${s.id}">Beklemeye al</button>`}</td></tr>`;}).join(''):`<tr><td colspan="9" class="empty">${APF.st==='bekliyor'?'Onay bekleyen bildirim yok.':'Kayıt yok.'}</td></tr>`}

 m.onchange=e=>{if(e.target.id==='apall'){$$('.apchk',m).forEach(x=>x.checked=e.target.checked);}upd();};
 const others=s=>s.eu!==ME.u?`\n\nNot: Bu bildirim ${s.e} adına yapılmış.`:'';

  if(d.no){const s=DB.subs[d.no];const v=await modal('Bildirimi reddet',`<p style="margin-top:0"><b>${esc(stu(s.sid).name)}</b> · ${s.k}. ${esc(skillName(s.k))}</p><label class="field">Gerekçe (öğrenci görecek)<textarea name="r" rows="3" placeholder="Ör. Bu uygulama derste değerlendirilmedi; tarih hatalı."></textarea></label>`,{ok:'Reddet',danger:true,validate:v=>v.r.trim().length<3?'Lütfen kısa bir gerekçe yazın.':''});
   if(!v)return;s.st='red';s.reason=v.r.trim();s.dt=Date.now();s.du=ME.name;s.seen=false;log(`${stu(s.sid).name} · ${s.k}. beceri bildirimini reddetti`);save();toast('Bildirim reddedildi');go('approvals',null,true);}
  if(d.edit){const s=DB.subs[d.edit];const v=await modal('Düzenle ve onayla',`<p style="margin-top:0"><b>${esc(stu(s.sid).name)}</b> · ${s.k}. ${esc(skillName(s.k))}</p>
   <label class="field">Başarılı olunan deneme<select name="att">${Array.from({length:Math.max(4,s.att,rec(s.sid,s.k).filter(x=>x).length+4)},(_,i)=>i+1).map(i=>`<option ${i===s.att?'selected':''}>${i}</option>`).join('')}</select></label>
   <label class="field">Uygulama tarihi<input type="date" name="d" value="${s.d}" max="${todayLocal()}"></label>
   <label class="field">Ders<select name="c">${allCourses().map(c=>`<option ${c===s.c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
   <label class="field">Öğretim elemanı<select name="eu">${DB.users.map(u=>`<option value="${u.u}" ${u.u===s.eu?'selected':''}>${esc(staffLabel(u))}</option>`).join('')}</select></label>`,{ok:'Kaydet ve onayla'});
   if(!v)return;Object.assign(s,{att:+v.att,d:v.d||s.d,c:v.c,eu:v.eu,e:staffLabel(DB.users.find(u=>u.u===v.eu))});const cf=subConflict(s);if(cf&&!confirm(`Uyarı: ${cf}. Yine de onaylansın mı?`)){save();go('approvals',null,true);return;}
   applySub(s);log(`${stu(s.sid).name} · ${s.k}. beceri bildirimini düzenleyip onayladı`);save();toast('Bildirim düzenlendi ve onaylandı');go('approvals',null,true);}
  if(d.undo){const s=DB.subs[d.undo];if(!confirm(s.st==='onay'?'Onay geri alınsın mı? Beceri tablosundaki ilgili kayıt silinir ve bildirim tekrar onay bekleyenlere düşer.':'Bildirim tekrar onay bekleyenlere alınsın mı?'))return;
   unapplySub(s);log(`${stu(s.sid).name} · ${s.k}. beceri bildirimini beklemeye aldı`);save();go('approvals',null,true);}
  if(e.target.id==='bulkok'){const ss=sel(),ok=ss.filter(s=>!subConflict(s)),skip=ss.length-ok.length;
   if(!confirm(`${ok.length} bildirim onaylansın mı?`+(skip?`\n${skip} bildirimde çakışma olduğu için atlanacak; onları tek tek kontrol edin.`:'')))return;
   ok.forEach(applySub);log(`${ok.length} bildirimi toplu onayladı`);save();toast(`${ok.length} bildirim onaylandı`);go('approvals',null,true);}
  if(e.target.id==='bulkno'){const ss=sel();const v=await modal(`${ss.length} bildirimi reddet`,`<label class="field">Gerekçe (öğrenciler görecek)<textarea name="r" rows="3"></textarea></label>`,{ok:'Reddet',danger:true,validate:v=>v.r.trim().length<3?'Lütfen kısa bir gerekçe yazın.':''});
   if(!v)return;ss.forEach(s=>{s.st='red';s.reason=v.r.trim();s.dt=Date.now();s.du=ME.name;s.seen=false;});log(`${ss.length} bildirimi toplu reddetti`);save();toast(`${ss.length} bildirim reddedildi`);go('approvals',null,true);}
 };

function pwFormHTML(){return `<form id="pwf" class="row" style="flex-direction:column;align-items:stretch;max-width:340px">
 <label class="field">Mevcut şifre<input type="password" id="p0" required></label><label class="field">Yeni şifre (en az 6 karakter)<input type="password" id="p1" required minlength="6"></label><label class="field">Yeni şifre (tekrar)<input type="password" id="p2" required minlength="6"></label>
 <button class="btn">Şifreyi değiştir</button></form>`;}
function wirePwForm(obj,after){$('#pwf').onsubmit=e=>{e.preventDefault();const p0=$('#p0').value,p1=$('#p1').value,p2=$('#p2').value;
 if(!checkPw(obj,p0)){toast('Mevcut şifre hatalı',1);return;}if(p1.length<6){toast('Yeni şifre en az 6 karakter olmalı',1);return;}if(p1!==p2){toast('Yeni şifreler aynı değil',1);return;}if(p1===p0){toast('Yeni şifre eskisiyle aynı olamaz',1);return;}
 Object.assign(obj,newSecret(p1));delete obj.def;delete obj.must;after&&after();save();toast('Şifreniz değiştirildi');$('#pwf').reset();};}

 <div class="card"><h3>Şifre değiştir</h3>${pwFormHTML()}</div></div>

 ${DB.users.map(u=>`<tr><td><b>${esc(staffLabel(u))}</b>${u.u===ME.u?' <span class="chip ok">siz</span>':''}</td><td>${esc(u.u)}</td><td class="mut">${fmtTime(u.last)||'–'}</td><td>${u.def?'<span class="chip warn">Varsayılan</span>':'<span class="chip ok">Değiştirildi</span>'}</td><td>${Object.values(DB.subs).filter(s=>s.st==='bekliyor'&&s.eu===u.u&&stu(s.sid)).length}</td>
 <td style="white-space:nowrap">${u.u!==ME.u?`<button class="btn ghost sm" data-rst="${u.u}">Şifreyi sıfırla</button> <button class="btn ghost danger sm" data-dst="${u.u}">Kaldır</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
 $('#pif').onsubmit=e=>{e.preventDefault();const n=$('#pn').value.trim();if(!n)return;ME.name=n;ME.title=$('#pt').value.trim();
  Object.values(DB.subs).forEach(s=>{if(s.eu===ME.u&&s.st==='bekliyor')s.e=staffLabel(ME);});save();$('#who').innerHTML=`<b>${esc(staffLabel(ME))}</b><span>Akademik personel</span>`;toast('Bilgiler kaydedildi');};
 wirePwForm(ME,()=>log('Şifresini değiştirdi'));
 m.onclick=async e=>{const d=e.target.dataset;
  if(d.rst){const u=DB.users.find(x=>x.u===d.rst);if(!confirm(`${u.name} kullanıcısının şifresi varsayılana (123456) sıfırlansın mı?`))return;Object.assign(u,newSecret(DEFAULT_PW),{def:true});log(`${u.name} kullanıcısının şifresini sıfırladı`);save();go('profile');toast('Şifre 123456 olarak sıfırlandı');}
  if(d.dst){const u=DB.users.find(x=>x.u===d.dst);const n=Object.values(DB.subs).filter(s=>s.st==='bekliyor'&&s.eu===u.u).length;
   if(!confirm(`${u.name} personel listesinden kaldırılsın mı?`+(n?`\nBu kişiye ait ${n} bekleyen bildirim, "Tüm personel" görünümünden onaylanabilir.`:'')+'\nGeçmiş kayıtlar silinmez.'))return;DB.users=DB.users.filter(x=>x!==u);log(`${u.name} personel hesabını kaldırdı`);save();go('profile');}
  if(e.target.id==='addst'){const v=await modal('Personel ekle',`<label class="field">Unvan<input name="t" value="Öğr. Gör."></label><label class="field">Ad Soyad<input name="n"></label><label class="field">Kullanıcı adı (Türkçe karakter ve boşluksuz)<input name="u" autocapitalize="off"></label><p class="mut" style="font-size:12.5px;margin:0">İlk şifre: <b>123456</b> (ilk girişte değiştirmesi önerilir).</p>`,{ok:'Ekle',
   validate:v=>!v.n.trim()?'Ad soyad girin.':!/^[a-z0-9._]{3,30}$/.test(v.u.trim())?'Kullanıcı adı küçük harf, rakam, nokta veya alt çizgiden oluşmalı.':DB.users.some(x=>x.u===v.u.trim())?'Bu kullanıcı adı kullanılıyor.':''});
   if(!v)return;DB.users.push(Object.assign({u:v.u.trim(),name:v.n.trim(),title:v.t.trim(),def:true},newSecret(DEFAULT_PW)));log(`${v.n.trim()} personel hesabını ekledi`);save();go('profile');toast('Personel eklendi');}
 };
};

/* ===================== ÖĞRENCİ PANELİ ===================== */
const myStu=()=>ACC&&ACC.sid?stu(ACC.sid):null;
const mySubs=()=>Object.values(DB.subs).filter(s=>s.aid===ACC.id||(ACC.sid&&s.sid===ACC.sid));
function stuPendingCard(m,title){m.innerHTML=`<div class="head"><h1>${title}</h1></div><div class="card"><h3>Kaydınız onay bekliyor</h3><p>Okul numaranız (<b>${esc(ACC.no)}</b>) öğrenci listesinde bulunamadığı için kaydınız akademik personelin onayına gönderildi. Onaylandıktan sonra beceri rehberinizi görebilir ve uygulama bildirebilirsiniz.</p>
 <p class="mut" style="font-size:13px;margin:0">Ad Soyad: ${esc(ACC.name)} · Seçilen sınıf: ${esc(clsName(ACC.cls))||'belirtilmedi'} · Kayıt: ${fmtTime(ACC.created)}</p></div>`;}
function skillState(sid,k,subs){const a=rec(sid,k),si=successIdx(a),cnt=a.filter(x=>x).length,p=subs.find(s=>s.k===k&&s.st==='bekliyor');
 if(si>=0)return{st:'ok',a,si};if(p)return{st:'pend',a,p};if(cnt)return{st:'warn',a};return{st:'none',a};}
const SST={ok:['ok','Hazır'],pend:['warn','Onay bekliyor'],warn:['warn','Devam ediyor'],none:['mut','Değerlendirilmedi']};
function freeAttempts(a){let last=-1;a.forEach((x,i)=>{if(x)last=i;});const r=[];for(let i=last+1;i<last+5;i++)r.push(i+1);return r;}
VIEWS.shome=m=>{
 const s=myStu();if(!s){stuPendingCard(m,'Hoş geldiniz');return;}
 const subs=mySubs(),states=SKILLS.map((_,i)=>skillState(s.id,i+1,subs)),ok=states.filter(x=>x.st==='ok').length;
 const dec=subs.filter(x=>x.st!=='bekliyor').sort((a,b)=>(b.dt||0)-(a.dt||0)).slice(0,6);
 const first=states.filter(x=>x.a[0]),firstOk=first.filter(x=>x.a[0].r==='+').length;
 m.innerHTML=`<div class="head"><h1>Merhaba, ${esc(s.name.split(' ')[0])}</h1><p>${esc(s.no)} · ${esc(clsName(s.cls))} · Beceri rehberindeki ilerlemen ve bildirimlerin.</p></div>
 ${ACC.must?'<div class="notice">Şifreniz öğretim elemanı tarafından sıfırlandı. Lütfen <a href="#" onclick="go(\'sprofile\');return false">Hesabım</a> sayfasından yeni bir şifre belirleyin.</div>':''}
 <div class="kpis"><div class="kpi"><div class="v">${ok}<span style="font-size:15px;color:var(--mut)">/104</span></div><div class="l">Hazır olunan beceri</div><div class="pbar" style="margin-top:8px"><i style="width:${pct(ok,104)}%"></i></div></div>
  <div class="kpi${subs.some(x=>x.st==='bekliyor')?' alert':''}"><div class="v">${subs.filter(x=>x.st==='bekliyor').length}</div><div class="l">Onay bekleyen bildirim</div></div>
  <div class="kpi"><div class="v">${subs.filter(x=>x.st==='onay').length}</div><div class="l">Onaylanan bildirim</div></div>
  <div class="kpi"><div class="v">${subs.filter(x=>x.st==='red').length}</div><div class="l">Reddedilen bildirim</div></div>
  <div class="kpi"><div class="v">%${pct(firstOk,first.length)}</div><div class="l">İlk denemede başarı</div></div></div>
 <div class="row" style="margin-bottom:16px"><button class="btn" onclick="go('submit')">+ Başarılı uygulama bildir</button><button class="btn ghost" onclick="go('sguide')">Beceri rehberim</button><button class="btn ghost" id="mypdf">Beceri kontrol tablom (PDF)</button></div>
 <div class="grid2" style="grid-template-columns:minmax(0,3fr) minmax(280px,2fr)">
 <div class="card"><h3>Bölümlere göre ilerleme</h3>${GROUPS.map(g=>{const n=g.to-g.from+1,d=states.slice(g.from-1,g.to).filter(x=>x.st==='ok').length;return `<div class="gprog"><span>B${g.id} · ${esc(g.name)}</span><div class="pbar"><i style="width:${pct(d,n)}%"></i></div><span style="text-align:right"><b>${d}</b>/${n}</span></div>`;}).join('')}</div>
 <div class="card chartcard" style="align-self:start"><h3>Beceri profili</h3><div class="chartbox"><canvas id="c-my"></canvas></div></div></div>
 <div class="card"><h3>Son kararlar</h3><div class="tablewrap"><table class="tbl"><tbody>${dec.length?dec.map(x=>`<tr><td>${x.k}. ${esc(skillName(x.k))}</td><td>${subStChip(x)}</td><td class="mut" style="font-size:12.5px">${esc(x.du||'')} · ${fmtTime(x.dt)}${x.reason?`<div style="color:var(--bad)">Gerekçe: ${esc(x.reason)}</div>`:''}</td></tr>`).join(''):'<tr><td class="empty">Henüz karar verilmiş bildirimin yok.</td></tr>'}</tbody></table></div></div>`;
 $('#mypdf').onclick=()=>cardPDF(s.id);
 mkChart($('#c-my'),{type:'radar',data:{labels:GROUPS.map(g=>'B'+g.id),datasets:[{label:'Hazır (%)',data:GROUPS.map(g=>pct(states.slice(g.from-1,g.to).filter(x=>x.st==='ok').length,g.to-g.from+1)),backgroundColor:'rgba(14,79,84,.18)',borderColor:COLORS.pri,pointBackgroundColor:COLORS.pri}]},
  options:{scales:{r:{beginAtZero:true,max:100,ticks:{stepSize:25}}},plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>GROUPS[c[0].dataIndex].name}}}}});
};
const SGF={q:'',st:''};
VIEWS.sguide=m=>{
 const s=myStu();if(!s){stuPendingCard(m,'Beceri rehberim');return;}
 const subs=mySubs();
 m.innerHTML=`<div class="head"><h1>Beceri rehberim</h1><p>104 becerinin durumu. Başarılı olduğun ama henüz işlenmemiş bir uygulamayı <b>Bildir</b> ile öğretim elemanının onayına gönderebilirsin.</p></div>
 <div class="card"><div class="row" style="margin-bottom:10px"><input id="gq" placeholder="Beceri ara…" value="${esc(SGF.q)}" style="flex:1;min-width:180px"><select id="gst"><option value="">Tüm durumlar</option>${Object.entries(SST).map(([k,v])=>`<option value="${k}" ${SGF.st===k?'selected':''}>${v[1]}</option>`).join('')}</select></div>
 <div class="tablewrap" style="max-height:none"><table class="tbl" id="gt"></table></div></div>`;
 const draw=()=>{SGF.q=$('#gq').value;SGF.st=$('#gst').value;const q=SGF.q.toLocaleLowerCase('tr');
  $('#gt').innerHTML='<thead><tr><th>No</th><th>Beceri</th><th>Denemeler</th><th>Durum</th><th>Hazır olma</th><th>Değerlendiren</th><th></th></tr></thead><tbody>'+GROUPS.map(g=>{
   const rows=groupSkills(g).map(k=>({k,x:skillState(s.id,k,subs)})).filter(({k,x})=>(!SGF.st||x.st===SGF.st)&&(!q||(k+' '+skillName(k)).toLocaleLowerCase('tr').includes(q)));
   if(!rows.length)return'';return `<tr class="grp"><td colspan="7">Bölüm ${g.id} · ${esc(g.name)}</td></tr>`+rows.map(({k,x})=>{const sc=x.si!=null&&x.si>=0?x.a[x.si]:null;
    return `<tr><td>${k}</td><td>${esc(skillName(k))}</td><td>${attDots(x.a)}</td><td><span class="chip ${SST[x.st][0]}">${SST[x.st][1]}</span></td><td>${sc?fmtDate(sc.d):''}</td><td style="font-size:12.5px">${sc?esc(sc.e||''):x.p?esc(x.p.e)+' <span class="mut">(bekliyor)</span>':''}</td>
    <td>${x.st==='ok'||x.st==='pend'?'':`<button class="btn sm" onclick="go('submit',${k})">Bildir</button>`}</td></tr>`;}).join('');}).join('')+'</tbody>';};
 draw();$('#gq').oninput=draw;$('#gst').onchange=draw;
};
VIEWS.submit=(m,k0)=>{
 const s=myStu();if(!s){stuPendingCard(m,'Uygulama bildir');return;}
 const subs=mySubs(),avail=k=>{const x=skillState(s.id,k,subs);return x.st!=='ok'&&x.st!=='pend'&&freeAttempts(x.a).length>0;};
 if(k0&&!avail(+k0))k0=null;
 const sem={1:'1. Yarıyıl',2:'2. Yarıyıl',3:'3. Yarıyıl',4:'4. Yarıyıl'};
 m.innerHTML=`<div class="head"><h1>Uygulama bildir</h1><p>Başarılı olduğun beceri uygulamasını bildir. Seçtiğin öğretim elemanı onayladığında beceri kontrol tablona işlenir.</p></div>
 <div class="grid2" style="grid-template-columns:minmax(0,3fr) minmax(260px,2fr)"><div class="card"><form id="sf" class="row" style="flex-direction:column;align-items:stretch">
  <label class="field">Beceri<select id="sk" required><option value="">Beceri seçin…</option>${GROUPS.map(g=>`<optgroup label="B${g.id} · ${esc(g.name)}">${groupSkills(g).map(k=>{const ok=avail(k),x=skillState(s.id,k,subs);return `<option value="${k}" ${ok?'':'disabled'} ${+k0===k?'selected':''}>${k}. ${esc(skillName(k))}${ok?'':' — '+SST[x.st][1].toLocaleLowerCase('tr')}</option>`;}).join('')}</optgroup>`).join('')}</select></label>
  <div id="skinfo" class="mut" style="font-size:12.5px"></div>
  <div class="row"><label class="field" style="flex:1;min-width:150px">Uygulama tarihi<input type="date" id="sd" max="${todayLocal()}" value="${todayLocal()}" required></label>
   <label class="field" style="flex:1;min-width:150px">Kaçıncı denemede başarılı oldun?<select id="sa"></select></label></div>
  <label class="field">Ders<select id="sc" required><option value="">Ders seçin…</option>${[1,2,3,4].map(n=>`<optgroup label="${sem[n]}">${COURSES.filter(c=>c.sem===n).map(c=>`<option>${esc(c.name)}</option>`).join('')}</optgroup>`).join('')}${DB.customCourses.length?`<optgroup label="Diğer">${DB.customCourses.map(c=>`<option>${esc(c)}</option>`).join('')}</optgroup>`:''}</select></label>
  <label class="field">Değerlendiren öğretim elemanı<select id="se" required><option value="">Öğretim elemanı seçin…</option>${DB.users.map(u=>`<option value="${u.u}">${esc(staffLabel(u))}</option>`).join('')}</select></label>
  <label class="field">Not (isteğe bağlı)<textarea id="sn2" rows="2" maxlength="300" placeholder="Ör. Laboratuvar uygulamasında, maket üzerinde"></textarea></label>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="go('sguide')">Vazgeç</button><button class="btn">Onaya gönder</button></div></form></div>
 <div class="card" style="align-self:start"><h3>Nasıl işler?</h3><ol class="steps"><li>Becerini, tarihini, dersini ve seni değerlendiren öğretim elemanını seç.</li><li>Bildirim öğretim elemanının onay listesine düşer.</li><li>Onaylanınca beceri kontrol tablona işlenir; reddedilirse gerekçesini <b>Bildirimlerim</b> sayfasında görürsün.</li></ol></div></div>`;
 const last=JSON.parse(sessionStorage.getItem('iay_son')||'{}');if(last.c)$('#sc').value=last.c;if(last.e)$('#se').value=last.e;
 const fill=()=>{const k=+$('#sk').value;if(!k){$('#sa').innerHTML='';$('#skinfo').innerHTML='';return;}const a=rec(s.id,k),fr=freeAttempts(a);
  $('#sa').innerHTML=fr.map(i=>`<option value="${i}">${i}. deneme</option>`).join('');
  $('#skinfo').innerHTML=a.some(x=>x)?`Bu beceride önceki kayıtların: ${attDots(a)} — ${fr[0]}. denemeden itibaren bildirebilirsin.`:'Bu beceride henüz kaydın yok.';};
 $('#sk').onchange=fill;fill();
 $('#sf').onsubmit=e=>{e.preventDefault();const k=+$('#sk').value,att=+$('#sa').value,d=$('#sd').value,c=$('#sc').value,eu=$('#se').value;
  if(!k||!att||!d||!c||!eu){toast('Lütfen tüm alanları doldurun',1);return;}if(d>todayLocal()){toast('İleri bir tarih seçilemez',1);return;}
  if(!avail(k)){toast('Bu beceri için bildirim yapılamaz',1);return;}
  const u=DB.users.find(x=>x.u===eu),id=uid('b');
  DB.subs[id]={id,sid:s.id,aid:ACC.id,k,att,d,c,eu,e:staffLabel(u),note:$('#sn2').value.trim(),st:'bekliyor',t:Date.now()};
  sessionStorage.setItem('iay_son',JSON.stringify({c,e:eu}));save();toast(`Bildirim ${staffLabel(u)} onayına gönderildi`);go('mysubs');};
};
const MSF={st:''};
VIEWS.mysubs=m=>{
 const s=myStu();if(!s){stuPendingCard(m,'Bildirimlerim');return;}
 const subs=mySubs().sort((a,b)=>b.t-a.t),list=subs.filter(x=>!MSF.st||x.st===MSF.st);
 let seen=0;subs.forEach(x=>{if(x.st==='red'&&!x.seen){x.seen=true;seen++;}});if(seen){save();buildNav();}
 const cnt=st=>subs.filter(x=>x.st===st).length;
 m.innerHTML=`<div class="head"><h1>Bildirimlerim</h1><p>Gönderdiğin uygulama bildirimleri ve öğretim elemanı kararları.</p></div>
 <div class="card"><div class="tabs"><button data-t="" class="${!MSF.st?'on':''}">Tümü (${subs.length})</button><button data-t="bekliyor" class="${MSF.st==='bekliyor'?'on':''}">Bekleyen (${cnt('bekliyor')})</button><button data-t="onay" class="${MSF.st==='onay'?'on':''}">Onaylanan (${cnt('onay')})</button><button data-t="red" class="${MSF.st==='red'?'on':''}">Reddedilen (${cnt('red')})</button></div>
 <div class="tablewrap" style="max-height:none"><table class="tbl"><thead><tr><th>Beceri</th><th>Deneme</th><th>Uygulama</th><th>Öğretim elemanı</th><th>Gönderim</th><th>Durum</th><th></th></tr></thead><tbody>
 ${list.length?list.map(x=>`<tr><td>${x.k}. ${esc(skillName(x.k))}${x.note?`<div class="mut" style="font-size:12px">“${esc(x.note)}”</div>`:''}</td><td>${x.att}.</td><td>${fmtDate(x.d)}<div class="mut" style="font-size:12px">${esc(x.c)}</div></td><td>${esc(x.e)}</td><td class="mut" style="font-size:12px;white-space:nowrap">${fmtTime(x.t)}</td>
  <td>${subStChip(x)}${x.dt?`<div class="mut" style="font-size:12px">${fmtTime(x.dt)}</div>`:''}${x.reason?`<div style="font-size:12.5px;color:var(--bad)">Gerekçe: ${esc(x.reason)}</div>`:''}</td>
  <td style="white-space:nowrap">${x.st==='bekliyor'?`<button class="btn ghost danger sm" data-cancel="${x.id}">Geri çek</button>`:x.st==='red'&&skillState(s.id,x.k,subs).st!=='ok'&&skillState(s.id,x.k,subs).st!=='pend'?`<button class="btn ghost sm" onclick="go('submit',${x.k})">Yeniden bildir</button>`:''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Bildirim yok. <a href="#" onclick="go(\'submit\');return false">Uygulama bildir</a></td></tr>'}</tbody></table></div></div>`;
 $$('[data-t]',m).forEach(b=>b.onclick=()=>{MSF.st=b.dataset.t;go('mysubs');});
 m.onclick=e=>{const id=e.target.dataset.cancel;if(!id)return;if(!confirm('Bildirim geri çekilsin mi?'))return;delete DB.subs[id];save();toast('Bildirim geri çekildi');go('mysubs');};
};
VIEWS.sprofile=m=>{
 const s=myStu();
 m.innerHTML=`<div class="head"><h1>Hesabım</h1></div>${ACC.must?'<div class="notice">Şifreniz sıfırlandı; lütfen yeni bir şifre belirleyin.</div>':''}
 <div class="grid2"><div class="card"><h3>Bilgilerim</h3><table class="tbl"><tbody><tr><td class="mut">Okul numarası</td><td><b>${esc(ACC.no)}</b></td></tr><tr><td class="mut">Ad Soyad</td><td>${esc(stuNameOf(ACC))}</td></tr><tr><td class="mut">Sınıf / grup</td><td>${esc(clsName(s?s.cls:ACC.cls))||'–'}</td></tr><tr><td class="mut">Hesap durumu</td><td>${s?'<span class="chip ok">Onaylı</span>':'<span class="chip warn">Onay bekliyor</span>'}</td></tr><tr><td class="mut">Kayıt tarihi</td><td>${fmtTime(ACC.created)}</td></tr></tbody></table>
  ${s?'<button class="btn ghost" id="mypdf2" style="margin-top:12px">Beceri kontrol tablom (PDF)</button>':''}<p class="mut" style="font-size:12.5px">Ad soyad veya numaranda hata varsa öğretim elemanına başvur.</p></div>
 <div class="card"><h3>Şifre değiştir</h3>${pwFormHTML()}</div></div>`;
 wirePwForm(ACC);if(s)$('#mypdf2').onclick=()=>cardPDF(s.id);
};

/* ===================== BAŞLAT ===================== */
if(window.Chart){Chart.defaults.font.family='"Segoe UI",system-ui,Roboto,Arial,sans-serif';Chart.defaults.color='#4d5c5b';}
let READY=false;
(async function boot(){
 await initCloud();
 if(CLOUD){try{await new Promise(r=>{const u=CLOUD.auth.onAuthStateChanged(()=>{u();r();});});await cloudStart();}
  catch(e){console.error(e);$('#lerr').innerHTML=esc(cloudErr(e))+' <a onclick="location.reload()">Tekrar dene</a>';return;}}
 else if(ensureUsers(DB))save();
 READY=true;
 $('#lmode').innerHTML=CLOUD?'<b style="color:var(--ok)">● Bulut modu</b> · veriler tüm cihazlarda ortak.':'Yerel mod · veriler yalnızca bu tarayıcıda saklanır.';
 let ss=null;try{ss=JSON.parse(sessionStorage.getItem(SESS));}catch(e){}
 if(ss){if(ss.role==='staff'){const u=DB.users.find(x=>x.u===ss.u);if(u){startSession('staff',u);return;}}
  else{const a=DB.accounts[ss.id];if(a&&!a.off){startSession('student',a);return;}}sessionStorage.removeItem(SESS);}
 setLoginTab('staff');
})();
</script>
