<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İAY Beceri Takip Sistemi</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.19.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#1c2626;--mut:#617170;--line:#dde4e2;--pri:#0e4f54;--pri2:#13686e;--pri-soft:#e3efee;--acc:#c4362c;--ok:#1d7f48;--ok-soft:#e1f3e8;--bad:#c4362c;--bad-soft:#fbe6e4;--warn:#c9800c;--warn-soft:#fdf1dc}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit}
h1{font-size:22px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px}
.mut{color:var(--mut)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0e4f54 0%,#0a3437 100%);padding:16px}
.lbox{background:#fff;border-radius:14px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.lbox .logo{width:52px;height:52px;border-radius:12px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;margin-bottom:14px}
.lbox h2{margin:0 0 2px;font-size:20px}
.lbox p{margin:0 0 20px;color:var(--mut);font-size:13px}
.lbox label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.lbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.lbox .btn{width:100%;margin-top:20px;padding:11px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.lmode{font-size:12px;color:var(--mut);border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.lmode a{color:var(--pri);font-weight:600}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;padding:8px 16px;border-top:1px solid rgba(255,255,255,.08)}
.sync i{width:8px;height:8px;border-radius:50%;background:#7fd19b;display:inline-block}
.sync.busy i{background:#f0c24b}.sync.off i{background:#ef7b72}
/* layout */
#app{display:flex;min-height:100vh}
aside{width:236px;flex:none;background:#0b3d41;color:#cfe3e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:15px}
.brand span{font-size:12px;opacity:.7}
.clsbox{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.clsbox label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-bottom:5px}
.clsbox select{width:100%;background:#fff;color:var(--ink);border:0;border-radius:8px;padding:8px 10px;font-weight:600}
.clsbadge{display:inline-block;background:var(--pri-soft);color:var(--pri);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:3px}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.active{background:#fff;color:var(--pri);font-weight:600}
.nav .num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.nav button.active .num{background:var(--acc);color:#fff}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;padding:14px 12px 4px}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
main{flex:1;min-width:0;padding:24px 28px 60px}
.topbar{display:none}
.head{margin-bottom:18px}
.head p{margin:0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
.field input,.field select,.field textarea{font-weight:400;color:var(--ink)}
input[type=text],input[type=date],input[type=password],input:not([type]),input[type=number],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:-1px}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn.ghost{background:#fff;color:var(--pri);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--pri)}
.btn.danger{background:var(--acc);border-color:var(--acc)}
.btn.ghost.danger{background:#fff;color:var(--acc)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.tablewrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:8px}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{background:#f6f8f7;text-align:left;font-weight:600;color:var(--mut);position:sticky;top:0;z-index:1}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:#fafcfb}
.tbl .grp td{background:var(--pri-soft);font-weight:700;color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;color:var(--pri);line-height:1.1}
.kpi .l{font-size:12px;color:var(--mut);margin-top:4px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.mut{background:#eef1f0;color:var(--mut)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 42px;position:relative;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-weight:700;display:flex;align-items:center;justify-content:center}
.notice{background:var(--warn-soft);border:1px solid #f1d39c;color:#7a4e06;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
/* skill picker */
.grpcard{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.grphead{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f6f8f7;cursor:pointer;user-select:none}
.grphead b{flex:1}
.grphead .cnt{font-size:12px;color:var(--mut)}
.grphead .arr{transition:transform .15s}
.grpcard.open .arr{transform:rotate(90deg)}
.grpbody{display:none;padding:6px 12px 10px 38px;columns:2 300px;column-gap:24px}
.grpcard.open .grpbody{display:block}
.grpbody label{display:flex;gap:8px;padding:3px 0;break-inside:avoid;cursor:pointer;font-size:13px}
.grpbody label span.n{color:var(--mut);min-width:22px}
input[type=checkbox]{accent-color:var(--pri);width:16px;height:16px;flex:none;margin-top:1px}
.stulist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;columns:2 220px}
.stulist label{display:flex;gap:8px;padding:2px 0;font-size:13px;break-inside:avoid;cursor:pointer}
/* entry grid */
.gridwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.grid thead th{background:#f6f8f7;position:sticky;z-index:2}
.grid thead tr:first-child th{top:0}
.grid thead tr:nth-child(2) th{top:44px}
.grid th.sk{min-width:150px;max-width:180px;height:44px;padding:4px 6px;font-weight:600;font-size:11.5px;line-height:1.2;white-space:normal;border-left:2px solid #b9c6c3}
.grid th.att{width:36px;height:22px;font-weight:500;color:var(--mut);font-size:11px}
.grid th.att.f,.grid td.gc.f{border-left:2px solid #b9c6c3}
.grid .sticky{position:sticky;background:#fff;z-index:1}
.grid thead .sticky{z-index:3;background:#f6f8f7}
.grid .c1{left:0;min-width:84px;padding:4px 8px}
.grid .c2{left:84px;min-width:170px;padding:4px 8px;border-right:2px solid #b9c6c3}
.grid td.gc{width:36px;height:30px;text-align:center;font-weight:700;font-size:16px}
.gc.ed{cursor:pointer}
.gc.ed:hover{background:var(--pri-soft)}
.gc.plus{color:var(--ok);background:var(--ok-soft)}
.gc.minus{color:var(--bad);background:var(--bad-soft)}
.gc.amb{color:var(--warn);background:var(--warn-soft)}
.gc.prior{background:#eceeed;color:#6d7776;cursor:help}
.gc.prior.plus{color:#3e7d58}
.gc.prior.minus{color:#a35a54}
.gc.done{background:repeating-linear-gradient(45deg,#f1f3f2,#f1f3f2 4px,#e6e9e8 4px,#e6e9e8 8px)}
.gc.pend{box-shadow:inset 0 0 0 2px #e8b33c}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin:10px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
/* overlay & toast */
#overlay{position:fixed;inset:0;background:rgba(242,244,243,.97);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:600;color:var(--pri)}
#overlay.on{display:flex}
.spin{width:38px;height:38px;border:4px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1100;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#1c2626;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast div.e{background:var(--acc)}
/* scan */
.scancard canvas{width:100%;max-width:900px;border:1px solid var(--line);border-radius:8px;display:block}
.scanmeta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
/* charts */
.chartcard{position:relative}
.chartbox{position:relative;height:320px}
.chartbox.tall{height:auto}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ctl select{padding:5px 8px;font-size:13px}
/* render areas */
#render-area{position:fixed;left:0;top:0;z-index:5;background:#fff}
#print-area{display:none}
/* OMR page (mm layout) */
.omr-page{position:relative;width:297mm;height:210mm;background:#fff;color:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.omr-page>div{position:absolute;box-sizing:border-box}
.o-mk{background:#000}
.o-title{font-size:13pt;font-weight:700;text-align:center;letter-spacing:.03em}
.o-info{font-size:8pt;text-align:center;color:#333}
.o-meta{font-size:8.5pt;display:flex;justify-content:space-between;gap:8px;border-top:0.3mm solid #000;border-bottom:0.3mm solid #000;padding:1.2mm 0}
.o-c{border:0.2mm solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.o-hd{font-size:8pt;font-weight:700;text-align:center;background:#f0f0f0}
.o-sk{font-weight:700;text-align:center;line-height:1.15;padding:0.6mm 1mm;background:#f0f0f0}
.o-at{align-items:flex-start;font-size:6.5pt;font-weight:700;padding-top:0.5mm}
.o-pm{font-size:8pt;font-weight:700;text-align:center;line-height:1}
.o-no{font-size:7.5pt;justify-content:flex-start;padding-left:1mm}
.o-nm{font-size:7.5pt;justify-content:flex-start;padding-left:1.2mm;white-space:nowrap}
.o-prior{font-size:13pt;font-weight:700;color:#555;background:#e9e9e9}
.o-done{background:repeating-linear-gradient(45deg,#fff,#fff 1mm,#e0e0e0 1mm,#e0e0e0 1.6mm)}
.o-bb{border:0.25mm solid #444;background:#fff}
.o-sep{width:0.6mm;background:#000}
.o-code{background:#000}
.o-foot{font-size:6.5pt;line-height:1.25;color:#222}
.o-sign{font-size:8pt}
/* student card page */
.card-page{position:relative;width:210mm;height:297mm;background:#fff;color:#000;padding:14mm 13mm;font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}
.card-page h2{font-size:13pt;text-align:center;margin:0 0 1mm}
.card-page .sub{font-size:8.5pt;text-align:center;margin-bottom:4mm;color:#333}
.card-page .info{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 6mm;font-size:9pt;margin-bottom:4mm;border:0.3mm solid #000;padding:2.5mm 3mm}
.card-page table{border-collapse:collapse;width:100%;font-size:8pt}
.card-page th,.card-page td{border:0.2mm solid #000;padding:1.1mm 1.5mm;text-align:left}
.card-page th{background:#eee}
.card-page tr.g td{background:#dfe9e8;font-weight:700}
.card-page .pn{position:absolute;bottom:8mm;right:13mm;font-size:8pt}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .omr-page{page-break-after:always;break-after:page}
}
@media (max-width:860px){
  #app{flex-direction:column}
  aside{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s;height:100%}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;gap:12px;background:#0b3d41;color:#fff;padding:10px 16px;position:sticky;top:0;z-index:40}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;font-size:18px}
  main{padding:16px 16px 60px}
  .grpbody{padding-left:14px}
}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="loginForm" autocomplete="off">
    <div class="logo">+</div>
    <h2>Beceri Takip Sistemi</h2>
    <p>İlk ve Acil Yardım Programı · Beceri Uygulama Değerlendirme</p>
    <label for="lu">Kullanıcı adı</label>
    <input id="lu" type="text" required>
    <label for="lp">Şifre</label>
    <input id="lp" type="password" required>
    <button class="btn" type="submit" id="lbtn">Giriş yap</button>
    <div class="err" id="lerr"></div>
    <div id="lmode" class="lmode"></div>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><b>İAY Beceri Takip</b><span>KMÜ SHMYO · İlk ve Acil Yardım</span></div>
    <div class="clsbox"><label for="clsSel">Aktif sınıf / grup</label><select id="clsSel"></select></div>
    <nav class="nav">
      <button data-view="home"><span class="num">⌂</span>Ana sayfa</button>
      <div class="sep">İş akışı</div>
      <button data-view="students"><span class="num">1</span>Öğrenci listesi</button>
      <button data-view="newform"><span class="num">2</span>Uygulama formu oluştur</button>
      <button data-view="forms"><span class="num">3</span>Formlar ve not girişi</button>
      <button data-view="scan"><span class="num">4</span>Fotoğraftan işle</button>
      <div class="sep">Raporlar</div>
      <button data-view="cards"><span class="num">≡</span>Öğrenci beceri tabloları</button>
      <button data-view="stats"><span class="num">%</span>İstatistik paneli</button>
      <div class="sep">Ayarlar</div>
      <button data-view="catalog"><span class="num">i</span>Beceri ve ders listesi</button>
      <button data-view="backup"><span class="num">⇅</span>Yedekleme</button>
    </nav>
    <div class="sync" id="sync" hidden><i></i><span>Bulut: kaydedildi</span></div>
    <div class="side-foot row between"><span>Kullanıcı: İAY</span><button id="logout">Çıkış</button></div>
  </aside>
  <div style="flex:1;min-width:0">
    <div class="topbar"><button id="menuBtn">☰</button><b>İAY Beceri Takip</b></div>
    <main id="main"></main>
  </div>
</div>

<div id="overlay"><div class="spin"></div><div id="ovtext">Hazırlanıyor…</div></div>
<div id="toast"></div>
<div id="render-area"></div>
<div id="print-area"></div>

<script>
/* ===================== SABİT VERİLER ===================== */
const GROUPS=[
 {id:1,name:'Temel Yaşam Desteği',from:1,to:10},
 {id:2,name:'Havayolu Yönetimi ve Solunum Desteği',from:11,to:29},
 {id:3,name:'İleri Yaşam Desteği',from:30,to:41},
 {id:4,name:'Hasta Bakım İlkeleri',from:42,to:73},
 {id:5,name:'Travma ve Acil Durum Yönetimi',from:74,to:86},
 {id:6,name:'Hasta Taşıma, İmmobilizasyon ve Kurtarma',from:87,to:96},
 {id:7,name:'Olay Yeri, Haberleşme ve Triyaj',from:97,to:100},
 {id:8,name:'Enfeksiyon Kontrolü, Etik ve Hukuk',from:101,to:104}];
const SKILLS=['Erişkin acil olgu yönetimi uygulaması','Pediatrik acil olgu yönetimi uygulaması','Erişkinlerde temel yaşam desteği uygulaması','Çocuklarda temel yaşam desteği uygulaması','Bebeklerde temel yaşam desteği uygulaması','Erişkinlerde yabancı cisim çıkarma','Çocuklarda yabancı cisim çıkarma','Bebeklerde yabancı cisim çıkarma','Otomatik eksternal defibrilatör (OED) kullanımı','Derlenme (koma) pozisyonu verme',

 if(!d)d=defDB();if(!Array.isArray(d.classes))d.classes=[];
 // eski sürüm verisi: sınıfı olmayan öğrencileri bir gruba topla

 if(!d.classes.find(c=>c.id===d.settings.activeClass))d.settings.activeClass=d.classes.length?d.classes[d.classes.length-1].id:'';
 return d;}

async function initCloud(){

 if(!cfg&&/^https?:$/.test(location.protocol)){try{const r=await fetch('/__/firebase/init.json',{cache:'no-store'});if(r.ok)cfg=await r.json();}catch(e){}}

const metaOf=d=>JSON.stringify({classes:d.classes,students:d.students,forms:d.forms,customCourses:d.customCourses,seq:d.seq});
function setSync(state,txt){const el=$('#sync');if(!el)return;el.hidden=false;el.className='sync'+(state?' '+state:'');el.querySelector('span').textContent=txt;}
function cloudSchedule(){clearTimeout(PUSH_T);setSync('busy','Bulut: kaydediliyor…');PUSH_T=setTimeout(cloudPush,350);}
async function cloudPush(){
 if(!CLOUD)return;const fs=CLOUD.fs,ops=[];
 const mj=metaOf(DB);if(mj!==LAST.meta)ops.push(['set',fs.collection('iay').doc('meta'),{json:mj,t:Date.now()},()=>LAST.meta=mj]);
 const ids=new Set([...Object.keys(DB.records),...Object.keys(LAST.rec)]);
 ids.forEach(sid=>{const r=DB.records[sid];const j=r&&Object.keys(r).length?JSON.stringify(r):null;if(j===(LAST.rec[sid]??null))return;
  const ref=fs.collection('iay_kayit').doc(sid);
  if(j)ops.push(['set',ref,{json:j,t:Date.now()},()=>LAST.rec[sid]=j]);else ops.push(['del',ref,null,()=>delete LAST.rec[sid]]);});
 if(!ops.length){if(!PENDING)setSync('','Bulut: kaydedildi');return;}
 ops.forEach(o=>o[3]());
 PENDING++;
 try{for(const part of chunk(ops,400)){const b=fs.batch();part.forEach(([t,ref,data])=>t==='set'?b.set(ref,data):b.delete(ref));await b.commit();}
  PENDING--;if(!PENDING)setSync('','Bulut: kaydedildi');}
 catch(e){PENDING--;console.error(e);LAST={meta:null,rec:{}};setSync('off','Bulut: kaydedilemedi');toast('Buluta kaydedilemedi: '+(e.code||e.message)+'. İnternet bağlantınızı kontrol edin.',1);}
}
window.addEventListener('beforeunload',e=>{if(CLOUD&&(PENDING||PUSH_T&&$('#sync')&&$('#sync').classList.contains('busy'))){e.preventDefault();e.returnValue='';}});
async function cloudLoad(){
 const fs=CLOUD.fs;
 const [m,rs]=await Promise.all([fs.collection('iay').doc('meta').get(),fs.collection('iay_kayit').get()]);
 let settings={};try{settings=JSON.parse(localStorage.getItem(KEY+'_ayar'))||{};}catch(e){}
 if(!m.exists){
  const local=normalize((()=>{try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}})());
  if(local&&local.students.length&&confirm(`Bulutta henüz veri yok. Bu tarayıcıda kayıtlı ${local.students.length} öğrenci ve ${local.forms.length} form var.\n\nBunlar buluta aktarılsın mı?`)){
   DB=loadDB(local);DB.settings=Object.assign(DB.settings,settings);LAST={meta:null,rec:{}};await cloudPush();toast('Veriler buluta aktarıldı');}
  else{DB=loadDB(Object.assign(defDB(),{settings:Object.assign(defDB().settings,settings)}));LAST={meta:null,rec:{}};}
 }else{
  const d=JSON.parse(m.data().json);d.records={};LAST={meta:m.data().json,rec:{}};
  rs.forEach(doc=>{const j=doc.data().json;LAST.rec[doc.id]=j;d.records[doc.id]=JSON.parse(j);});
  d.settings=Object.assign(defDB().settings,settings);DB=loadDB(d);
  if(metaOf(DB)!==LAST.meta)cloudSchedule();
 }
 setSync('','Bulut: kaydedildi');
 cloudListen();
}
function cloudListen(){
 UNSUB.forEach(u=>u());UNSUB=[];const fs=CLOUD.fs;let first1=true,first2=true;
 UNSUB.push(fs.collection('iay').doc('meta').onSnapshot(s=>{if(first1){first1=false;return;}if(s.metadata.hasPendingWrites||!s.exists)return;const j=s.data().json;if(j===LAST.meta)return;
  LAST.meta=j;const x=JSON.parse(j);Object.assign(DB,{classes:x.classes||[],students:x.students||[],forms:x.forms||[],customCourses:x.customCourses||[],seq:Object.assign(DB.seq,x.seq||{})});
  if(!DB.classes.find(c=>c.id===DB.settings.activeClass))DB.settings.activeClass=DB.classes.length?DB.classes[DB.classes.length-1].id:'';remoteRefresh();},e=>{console.error(e);setSync('off','Bulut: bağlantı yok');}));
 UNSUB.push(fs.collection('iay_kayit').onSnapshot(s=>{if(first2){first2=false;return;}if(s.metadata.hasPendingWrites)return;let ch=0;
  s.docChanges().forEach(c=>{const id=c.doc.id;if(c.type==='removed'){if(id in LAST.rec){delete LAST.rec[id];delete DB.records[id];ch++;}return;}
   const j=c.doc.data().json;if(j===LAST.rec[id])return;LAST.rec[id]=j;DB.records[id]=JSON.parse(j);ch++;});
  if(ch)remoteRefresh();},e=>console.error(e)));
}

   save();draw();drawCls();}catch(err){console.error(err);toast('Dosya okunamadı: '+err.message,1);}

function parseStudentRows(rows){
 rows=rows.map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(c=>c));
 if(!rows.length)return[];
 const norm=s=>s.toLocaleLowerCase('tr-TR').replace(/\s+/g,' ');
 let hi=-1,noC=-1,nameC=-1,adC=-1,soyC=-1;
 for(let i=0;i<Math.min(6,rows.length);i++){const r=rows[i].map(norm);
  const n=r.findIndex(c=>/(numara|öğrenci no|ogrenci no|^no\.?$|okul no|öğr\.? ?no)/.test(c));
  const nm=r.findIndex(c=>/(ad[ıi]? ?soyad|isim|ad-soyad|ad \/ soyad)/.test(c));
  const ad=r.findIndex(c=>/^(ad[ıi]?|isim)$/.test(c));const so=r.findIndex(c=>/^soyad[ıi]?$/.test(c));
  if(n>=0||nm>=0||(ad>=0&&so>=0)){hi=i;noC=n;nameC=nm;adC=ad;soyC=so;break;}}
 const data=hi>=0?rows.slice(hi+1):rows;
 if(hi<0){const numeric=/\d{3,}/.test(data[0][0]||'');noC=numeric?0:-1;nameC=numeric?1:0;
  if(numeric&&data[0].length>=3&&data[0][2]&&!/\d/.test(data[0][2])&&data.every(r=>(r[1]||'').split(' ').length===1)){nameC=-1;adC=1;soyC=2;}}
 const out=[];let auto=0;const seen=new Set();
 data.forEach(r=>{let name=nameC>=0?r[nameC]:[r[adC]||'',r[soyC]||''].join(' ').trim();let no=noC>=0?r[noC]:'';
  if(!name)return;if(!no)no='OTO-'+(++auto);if(seen.has(no))return;seen.add(no);out.push({no,name:name.replace(/\s+/g,' ')});});
 return out;
}

function baseRec(form,sid,k){return rec(sid,k).map(x=>x&&x.f!==form.id?x:null);}
function printStates(form,sid,k){const b=baseRec(form,sid,k),bs=successIdx(b);
 return b.map((x,i)=>x?{type:'prior',r:x.r,x}:(bs>=0&&i>bs?{type:'done'}:{type:'bubble'}));}
function formPages(f){const studs=f.studentIds.filter(stu);const sk=chunk(f.skillIds,f.spp),st=chunk(studs,f.rpp);const out=[];
 sk.forEach(s=>st.forEach(t=>out.push({skills:s,students:t})));out.forEach((p,i)=>{p.index=i;p.total=out.length;});return out;}
function formFill(f){let n=0;f.studentIds.forEach(s=>f.skillIds.forEach(k=>rec(s,k).forEach(x=>{if(x&&x.f===f.id)n++;})));return n;}

/* ===================== FORM DETAY & EKRANDAN GİRİŞ ===================== */
function cellStates(form,sid,k,pending){
 const a=rec(sid,k),base=a.map(x=>x&&x.f!==form.id?x:null),bs=successIdx(base);
 const cur=a.map((x,i)=>{if(base[i])return base[i];const key=sid+'|'+k+'|'+i;if(pending&&key in pending)return pending[key]?{r:pending[key],pend:1}:null;return x;});
 return cur.map((x,i)=>{
  if(base[i])return{cls:'prior '+(x.r==='+'?'plus':'minus'),txt:x.r==='+'?'+':'−',title:`${i+1}. deneme ${x.r==='+'?'başarılı':'başarısız'} · ${x.c} · ${fmtDate(x.d)}${x.e?' · '+x.e:''}`,ed:0};
  if(bs>=0&&i>bs)return{cls:'done',txt:'',title:'Beceri önceki bir derste tamamlandı',ed:0};
  if(x)return{cls:'ed '+(x.r==='+'?'plus':x.r==='?'?'amb':'minus')+(x.pend?' pend':''),txt:x.r==='+'?'+':x.r==='?'?'?':'−',title:'Değiştirmek için tıklayın',ed:1};
  return{cls:'ed',txt:'',title:'Tıklayın: + → − → boş',ed:1};});
}
function gridHTML(form,skills,students,pending){
 let h='<table class="grid"><thead><tr><th rowspan="2" class="sticky c1">No</th><th rowspan="2" class="sticky c2">Ad Soyad</th>';
 skills.forEach(k=>h+=`<th colspan="4" class="sk" title="${esc(skillName(k))}">${k}. ${esc(skillName(k))}</th>`);
 h+='</tr><tr>';skills.forEach(()=>{for(let i=1;i<=4;i++)h+=`<th class="att${i===1?' f':''}">${i}.D</th>`;});h+='</tr></thead><tbody>';
 students.forEach(sid=>{const s=stu(sid);if(!s)return;h+=`<tr><td class="sticky c1">${esc(s.no)}</td><td class="sticky c2">${esc(s.name)}</td>`;
  skills.forEach(k=>cellStates(form,sid,k,pending).forEach((c,i)=>h+=`<td class="gc ${c.cls}${i===0?' f':''}" data-s="${sid}" data-k="${k}" data-i="${i}" title="${esc(c.title)}">${c.txt}</td>`));h+='</tr>';});
 return h+'</tbody></table>';
}

/* ===================== OMR SAYFA DÜZENİ (mm) ===================== */
const PG={W:297,H:210,X0:20,X1:277,Y0:31,cNo:15,cName:47,h1:15,h2:8,rowH:7};
const MARKS=[[8,8],[281,8],[281,194],[8,194]];            // sol üst, sağ üst, sağ alt, sol alt
const MC=MARKS.map(([x,y])=>[x+4,y+4]);                     // işaret merkezleri
const ROWS_H=186-(PG.Y0+PG.h1+PG.h2),MAXR=Math.floor(ROWS_H/5);   // satır yüksekliği en az 5 mm → sayfada en fazla 26 öğrenci
function layoutFor(n,pages){n=Math.max(1,n);const rpp=Math.ceil(n/pages);const real=Math.ceil(n/rpp);return{ok:rpp<=MAXR,rpp,pages:real,rowH:Math.min(8,Math.floor(ROWS_H/rpp*10)/10)};}
function geom(spp,rh){rh=rh||PG.rowH;const sx=PG.X0+PG.cNo+PG.cName,bw=(PG.X1-sx)/spp,aw=bw/4;return{sx,bw,aw,rh,b:Math.min(aw*0.36,4.2,rh*0.62),top:PG.Y0+PG.h1+PG.h2};}
function bubbleRect(g,j,a,w,i){return{x:g.sx+j*g.bw+a*g.aw+g.aw*(w?0.72:0.28)-g.b/2,y:g.top+i*g.rh+(g.rh-g.b)/2,w:g.b,h:g.b};}
function codeRect(i){return{x:36+i*6,y:196,w:4,h:5};}
function encode(num,page){const c=(num+page*5+7)%16,b=[];for(let i=13;i>=0;i--)b.push(num>>i&1);for(let i=5;i>=0;i--)b.push(page>>i&1);for(let i=3;i>=0;i--)b.push(c>>i&1);return b;}
function decode(bits){const v=(a,b)=>bits.slice(a,b).reduce((s,x)=>s*2+x,0);const num=v(0,14),page=v(14,20),chk=v(20,24);return{num,page,valid:num>0&&chk===(num+page*5+7)%16};}
function omrPageHTML(f,p){
 const g=geom(f.spp,f.rowH),mm=v=>(+v).toFixed(2)+'mm';
 const box=(x,y,w,h,cls,inner='',st='')=>`<div class="${cls}" style="left:${mm(x)};top:${mm(y)};width:${mm(w)};height:${mm(h)};${st}">${inner}</div>`;
 const fs={3:7.2,4:6.6,5:6,6:5.5}[f.spp]||6;
 let h='<div class="omr-page">';
 MARKS.forEach(([x,y])=>h+=box(x,y,8,8,'o-mk'));
 h+=`<div class="o-title" style="left:24mm;top:8mm;width:249mm">BECERİ UYGULAMA DEĞERLENDİRME FORMU</div>`;
 h+=`<div class="o-info" style="left:24mm;top:14.5mm;width:249mm">Karamanoğlu Mehmetbey Üniversitesi · Sağlık Hizmetleri MYO · İlk ve Acil Yardım Programı</div>`;
 h+=`<div class="o-meta" style="left:24mm;top:20mm;width:249mm"><span><b>Ders:</b> ${esc(f.course)}</span><span><b>Sınıf:</b> ${esc(clsName(f.cls))}</span><span><b>Tarih:</b> ${fmtDate(f.date)}</span><span><b>Öğretim Elemanı:</b> ${esc(f.evaluator||'..............................')}</span><span><b>Form No:</b> ${f.num} &nbsp; <b>Sayfa:</b> ${p.index+1}/${p.total}</span></div>`;
 h+=box(PG.X0,PG.Y0,PG.cNo,PG.h1+PG.h2,'o-c o-hd','Öğrenci<br>No');
 h+=box(PG.X0+PG.cNo,PG.Y0,PG.cName,PG.h1+PG.h2,'o-c o-hd','Adı Soyadı');
 p.skills.forEach((k,j)=>{const x=g.sx+j*g.bw;
  h+=box(x,PG.Y0,g.bw,PG.h1,'o-c o-sk',`${k}. ${esc(skillName(k))}`,`font-size:${fs}pt`);
  for(let a=0;a<4;a++){const ax=x+a*g.aw;h+=box(ax,PG.Y0+PG.h1,g.aw,PG.h2,'o-c o-at',`${a+1}. Den.`);
   const r0=bubbleRect(g,j,a,0,0),r1=bubbleRect(g,j,a,1,0);
   h+=box(r0.x+r0.w/2-2,PG.Y0+PG.h1+4.2,4,3,'o-pm','+');h+=box(r1.x+r1.w/2-2,PG.Y0+PG.h1+4.2,4,3,'o-pm','−');}});
 p.students.forEach((sid,i)=>{const s=stu(sid),y=g.top+i*g.rh;
  h+=box(PG.X0,y,PG.cNo,g.rh,'o-c o-no',esc(s?s.no:''));h+=box(PG.X0+PG.cNo,y,PG.cName,g.rh,'o-c o-nm',esc(s?s.name:''));
  p.skills.forEach((k,j)=>{const st=printStates(f,sid,k);for(let a=0;a<4;a++){const ax=g.sx+j*g.bw+a*g.aw,c=st[a];
   if(c.type==='prior')h+=box(ax,y,g.aw,g.rh,'o-c o-prior',c.r==='+'?'+':'−');
   else if(c.type==='done')h+=box(ax,y,g.aw,g.rh,'o-c o-done');
   else{h+=box(ax,y,g.aw,g.rh,'o-c');[0,1].forEach(w=>{const r=bubbleRect(g,j,a,w,i);h+=box(r.x,r.y,r.w,r.h,'o-bb');});}}});});
 const th=PG.h1+PG.h2+p.students.length*g.rh;
 p.skills.forEach((k,j)=>h+=box(g.sx+j*g.bw-0.3,PG.Y0,0.6,th,'o-sep'));
 h+=box(PG.X1-0.3,PG.Y0,0.6,th,'o-sep');
 h+=`<div class="o-sign" style="left:190mm;top:${mm(Math.min(PG.Y0+th+3,186))};width:87mm">Öğretim Elemanı İmza: ...................................</div>`;
 encode(f.num,p.index).forEach((b,i)=>{if(b){const r=codeRect(i);h+=box(r.x,r.y,r.w,r.h,'o-code');}});
 h+=`<div class="o-foot" style="left:186mm;top:195mm;width:92mm">Başarılı ise <b>+</b>, başarısız ise <b>−</b> kutusunu tamamen karalayın. Gri hücre: önceki dersten gelen sonuç · Taralı hücre: beceri tamamlandı. Köşe karelerini ve alttaki kodu kapatmayın.</div>`;
 return h+'</div>';
}

async function elementsToPDF(els,orient,name){

 for(let i=0;i<els.length;i++){overlay(1,`PDF hazırlanıyor… (${i+1}/${els.length})`);
  const c=await html2canvas(els[i],{scale:2.4,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,windowWidth:els[i].scrollWidth,windowHeight:els[i].scrollHeight});
  if(i)pdf.addPage('a4',orient);pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,H);}
 pdf.save(name);
}

/* ===================== GÖRÜNTÜ İŞLEME (OMR) ===================== */
function loadImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('Görsel açılamadı'));img.src=URL.createObjectURL(file);});}
function solveLinear(A,b){const n=b.length;for(let i=0;i<n;i++){let mx=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[mx][i]))mx=r;[A[i],A[mx]]=[A[mx],A[i]];[b[i],b[mx]]=[b[mx],b[i]];
 if(Math.abs(A[i][i])<1e-12)return null;for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}
 const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}return x;}
function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}return solveLinear(A,b);}
function hmap(h,x,y){const w=h[6]*x+h[7]*y+1;return[(h[0]*x+h[1]*y+h[2])/w,(h[3]*x+h[4]*y+h[5])/w];}
function analyzeImage(img){
 const maxD=1800,sc=Math.min(1,maxD/Math.max(img.naturalWidth,img.naturalHeight));
 const W=Math.max(1,Math.round(img.naturalWidth*sc)),H=Math.max(1,Math.round(img.naturalHeight*sc));
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,W,H);
 const px=cx.getImageData(0,0,W,H).data,N=W*H,g=new Uint8Array(N);
 for(let i=0;i<N;i++)g[i]=(px[i*4]*299+px[i*4+1]*587+px[i*4+2]*114)/1000;
 const W1=W+1,I=new Float64Array(W1*(H+1));
 for(let y=0;y<H;y++){let row=0;for(let x=0;x<W;x++){row+=g[y*W+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+row;}}
 const r=Math.max(8,Math.round(Math.max(W,H)/28)),dark=new Uint8Array(N);
 for(let y=0;y<H;y++){const y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);for(let x=0;x<W;x++){const x0=Math.max(0,x-r),x1=Math.min(W,x+r+1);
  const mean=(I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0])/((x1-x0)*(y1-y0));const v=g[y*W+x];if(v<mean-Math.max(14,mean*0.2))dark[y*W+x]=1;}}
 // bağlı bileşenler
 const stack=new Int32Array(N),seen=new Uint8Array(N),comps=[];
 for(let i=0;i<N;i++){if(!dark[i]||seen[i])continue;let sp=0;stack[sp++]=i;seen[i]=1;let area=0,minx=W,maxx=0,miny=H,maxy=0,sx=0,sy=0;
  while(sp){const p=stack[--sp],x=p%W,y=(p-x)/W;area++;sx+=x;sy+=y;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
   if(x>0&&dark[p-1]&&!seen[p-1]){seen[p-1]=1;stack[sp++]=p-1;}if(x<W-1&&dark[p+1]&&!seen[p+1]){seen[p+1]=1;stack[sp++]=p+1;}
   if(y>0&&dark[p-W]&&!seen[p-W]){seen[p-W]=1;stack[sp++]=p-W;}if(y<H-1&&dark[p+W]&&!seen[p+W]){seen[p+W]=1;stack[sp++]=p+W;}}
  if(area>=25)comps.push({area,minx,maxx,miny,maxy,cx:sx/area,cy:sy/area});}
 const ms=Math.min(W,H);
 let cand=comps.filter(c=>{const bw=c.maxx-c.minx+1,bh=c.maxy-c.miny+1,fill=c.area/(bw*bh),asp=bw/bh;return fill>0.7&&asp>0.55&&asp<1.8&&Math.max(bw,bh)>=ms*0.008&&Math.max(bw,bh)<=ms*0.13;});
 cand.sort((a,b)=>b.area-a.area);
 if(cand.length)cand=cand.filter(c=>c.area>=cand[0].area*0.2).slice(0,12);
 const res={W,H,cv,px,dark,ok:false};
 if(cand.length<4)return res;

  const q=[cand[a],cand[b],cand[c],cand[d]],mx=(q[0].cx+q[1].cx+q[2].cx+q[3].cx)/4,my=(q[0].cy+q[1].cy+q[2].cy+q[3].cy)/4;

  let ar=0;for(let i=0;i<4;i++){const p=q[i],s=q[(i+1)%4];ar+=p.cx*s.cy-s.cx*p.cy;}ar=Math.abs(ar)/2;

 res.ok=true;res.quad=best;
 const frac=(h,rc,inset=0.22,k=11)=>{let c=0,t=0;for(let a=0;a<k;a++)for(let b=0;b<k;b++){const x=rc.x+rc.w*(inset+(1-2*inset)*(a+0.5)/k),y=rc.y+rc.h*(inset+(1-2*inset)*(b+0.5)/k);
  const[u,v]=hmap(h,x,y),xi=Math.round(u),yi=Math.round(v);if(xi<0||yi<0||xi>=W||yi>=H)continue;t++;if(dark[yi*W+xi])c++;}return t?c/t:0;};
 const tries=[];
 for(let rot=0;rot<4;rot++){const pts=[0,1,2,3].map(i=>{const p=best[(start+rot)%4];return null;});
  const dst=[0,1,2,3].map(i=>{const p=best[(start+rot+i)%4];return[p.cx,p.cy];});
  const h=homography(MC,dst);if(!h)continue;const bits=[];for(let i=0;i<24;i++)bits.push(frac(h,codeRect(i),0.2,7)>0.5?1:0);

  if(xi>=0&&yi>=0&&xi<A.W&&yi<A.H){const s=(yi*A.W+xi)*4;od.data[o]=A.px[s];od.data[o+1]=A.px[s+1];od.data[o+2]=A.px[s+2];}else{od.data[o]=od.data[o+1]=od.data[o+2]=220;}od.data[o+3]=255;}

function computeStats(flt){
 const course=flt.course||'',grp=flt.group?GROUPS.find(g=>g.id==flt.group):null;
 const skills=[];for(let k=1;k<=104;k++)if(!grp||(k>=grp.from&&k<=grp.to))skills.push(k);
 const S={attTot:[0,0,0,0],attPlus:[0,0,0,0],succAt:[0,0,0,0],pairs:0,completed:0,failed:0,totalAttempts:0,sumAtt:0,skill:{},student:{},group:{},course:{}};
 skills.forEach(k=>S.skill[k]={k,n:0,s:[0,0,0,0],fail:0,ongoing:0,sumAtt:0});
 GROUPS.forEach(g=>S.group[g.id]={g,n:0,done:0,first:0,possible:0});
 DB.students.filter(st=>!flt.cls||st.cls===flt.cls).forEach(st=>{
  const ss=S.student[st.id]={st,n:0,done:0,first:0,firstN:0,sumAtt:0,attempts:0};
  skills.forEach(k=>{const gr=S.group[groupOf(k).id];gr.possible++;
   const a=rec(st.id,k).map(x=>x&&(!course||x.c===course)?x:null);if(!a.some(x=>x))return;
   S.pairs++;ss.n++;const sk=S.skill[k];sk.n++;gr.n++;
   a.forEach((x,i)=>{if(!x)return;S.attTot[i]++;S.totalAttempts++;ss.attempts++;if(x.r==='+')S.attPlus[i]++;
    const c=S.course[x.c]||(S.course[x.c]={n:0,plus:0});c.n++;if(x.r==='+')c.plus++;});
   if(a[0]){ss.firstN++;if(a[0].r==='+'){ss.first++;gr.first++;}}
   const si=successIdx(a);
   if(si>=0){S.succAt[si]++;S.completed++;S.sumAtt+=si+1;sk.s[si]++;sk.sumAtt+=si+1;ss.done++;ss.sumAtt+=si+1;gr.done++;}
   else if(a.filter(x=>x).length>=4||a[3]){S.failed++;sk.fail++;}else sk.ongoing++;});});
 S.firstRate=pct(S.attPlus[0],S.attTot[0]);S.overall=pct(S.completed,S.pairs);S.avgAtt=S.completed?Math.round(S.sumAtt/S.completed*100)/100:0;S.skills=skills;
 return S;
}

   options:t==='bar'?{scales:{y:{beginAtZero:true,max:mt==='n'?undefined:100}},plugins:{legend:{display:false}}}:t==='radar'?{scales:{r:{beginAtZero:true,max:mt==='n'?undefined:100}}}:{plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:11}}}}}});};
 // 3) beceri
 const drawSkill=()=>{const mt=$('#m-skill').value,o=$('#o-skill').value;old('c-skill');let ks=S.skills.filter(k=>S.skill[k].n);
  const val=k=>{const x=S.skill[k],d=x.s.reduce((a,y)=>a+y,0);return mt==='first'?pct(x.s[0],x.n):mt==='second'?pct(x.s[0]+x.s[1],x.n):mt==='overall'?pct(d,x.n):mt==='avg'?(d?Math.round(x.sumAtt/d*100)/100:0):pct(x.s[0],x.n);};
  if(o!=='num')ks.sort((a,b)=>o==='desc'?val(b)-val(a):val(a)-val(b));
  const box=$('#box-skill'.replace('skill','c-skill'));box.style.height=Math.max(260,ks.length*24+90)+'px';
  const labels=ks.map(k=>{const n=k+'. '+skillName(k);return n.length>48?n.slice(0,46)+'…':n;});
  const ds=mt==='dist'?[['1. denemede',0,COLORS.a1],['2. denemede',1,COLORS.a2],['3. denemede',2,COLORS.a3],['4. denemede',3,COLORS.a4]].map(([l,i,c])=>({label:l,data:ks.map(k=>pct(S.skill[k].s[i],S.skill[k].n)),backgroundColor:c}))
   .concat([{label:'Başarısız (4 deneme)',data:ks.map(k=>pct(S.skill[k].fail,S.skill[k].n)),backgroundColor:COLORS.fail},{label:'Devam ediyor',data:ks.map(k=>pct(S.skill[k].ongoing,S.skill[k].n)),backgroundColor:COLORS.ongoing}])
   :[{label:$('#m-skill').selectedOptions[0].text,data:ks.map(val),backgroundColor:COLORS.pri,borderRadius:3}];
  mkChart($('#c-skill'),{type:'bar',data:{labels,datasets:ds},options:{indexAxis:'y',scales:{x:{stacked:mt==='dist',beginAtZero:true,max:mt==='avg'?4:100},y:{stacked:mt==='dist',ticks:{font:{size:11}}}},plugins:{legend:{display:mt==='dist',position:'top'},tooltip:{callbacks:{afterLabel:c=>`(${S.skill[ks[c.dataIndex]].n} öğrenci değerlendirildi)`}}}}});};
 // 4) öğrenci
 const drawStu=()=>{const mt=$('#m-stu').value,t=$('#t-stu').value,o=$('#o-stu').value;old('c-stu');
  let ss=Object.values(S.student).filter(x=>x.n);
  const val=x=>mt==='first'?pct(x.first,x.firstN):mt==='done'?x.done:mt==='overall'?pct(x.done,x.n):(x.done?Math.round(x.sumAtt/x.done*100)/100:0);
  if(o==='no')sortStudents(ss.map(x=>x.st)).forEach((st,i)=>S.student[st.id]._o=i),ss.sort((a,b)=>a._o-b._o);else ss.sort((a,b)=>o==='desc'?val(b)-val(a):val(a)-val(b));
  const horiz=t==='bar';const box=$('#box-c-stu');box.style.height=(horiz?Math.max(260,ss.length*22+80):380)+'px';
  mkChart($('#c-stu'),{type:t==='line'?'line':'bar',data:{labels:ss.map(x=>x.st.name),datasets:[{label:$('#m-stu').selectedOptions[0].text,data:ss.map(val),backgroundColor:ss.map(x=>{const v=pct(x.done,x.n);return v>=75?COLORS.a1:v>=50?COLORS.a3:COLORS.fail;}),borderColor:COLORS.pri,borderRadius:3,tension:.3}]},
   options:{indexAxis:horiz?'y':'x',scales:{[horiz?'x':'y']:{beginAtZero:true,max:mt==='first'||mt==='overall'?100:undefined},[horiz?'y':'x']:{ticks:{font:{size:11},autoSkip:false}}},plugins:{legend:{display:false}}}});};
 function old(id){const c=CHARTS.find(x=>x.canvas.id===id);if(c){c.destroy();CHARTS=CHARTS.filter(x=>x!==c);}}
 drawAtt();drawGrp();drawSkill();drawStu();
 $('#t-att').onchange=drawAtt;$('#m-grp').onchange=drawGrp;$('#t-grp').onchange=drawGrp;$('#m-skill').onchange=drawSkill;$('#o-skill').onchange=drawSkill;$('#m-stu').onchange=drawStu;$('#t-stu').onchange=drawStu;$('#o-stu').onchange=drawStu;
 $$('[data-png]',b).forEach(btn=>btn.onclick=()=>{const c=CHARTS.find(x=>x.canvas.id===btn.dataset.png);if(!c)return;const a=document.createElement('a');a.href=c.toBase64Image('image/png',1);a.download=btn.dataset.png+'.png';a.click();});
}
function exportStatsXLSX(S){
 if(!needLib('Excel',window.XLSX))return;const wb=XLSX.utils.book_new();
 const sk=[['No','Beceri','Bölüm','Değerlendirilen','1. denemede +','2. denemede +','3. denemede +','4. denemede +','Başarısız','Devam','İlk deneme %','Genel %','Ort. deneme']];
 S.skills.filter(k=>S.skill[k].n).forEach(k=>{const x=S.skill[k],d=x.s.reduce((a,y)=>a+y,0);sk.push([k,skillName(k),groupOf(k).name,x.n,...x.s,x.fail,x.ongoing,pct(x.s[0],x.n),pct(d,x.n),d?+(x.sumAtt/d).toFixed(2):'']);});
 const st=[['Öğrenci No','Ad Soyad','Değerlendirilen','Tamamlanan','İlk deneme %','Genel %','Ort. deneme']];
 sortStudents(Object.values(S.student).map(x=>x.st)).forEach(s=>{const x=S.student[s.id];st.push([s.no,s.name,x.n,x.done,pct(x.first,x.firstN),pct(x.done,x.n),x.done?+(x.sumAtt/x.done).toFixed(2):'']);});
 const at=[['Deneme','Toplam deneme','Başarılı','Başarı %']];[0,1,2,3].forEach(i=>at.push([(i+1)+'. deneme',S.attTot[i],S.attPlus[i],pct(S.attPlus[i],S.attTot[i])]));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sk),'Beceri bazlı');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(st),'Öğrenci bazlı');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(at),'Deneme bazlı');
 XLSX.writeFile(wb,'beceri_istatistikleri.xlsx');
}

/* ===================== ÖĞRENCİ BECERİ TABLOSU ===================== */
function cardRows(sid){return SKILLS.map((n,i)=>{const k=i+1,a=rec(sid,k),si=successIdx(a),cnt=a.filter(x=>x).length,last=a.filter(x=>x).pop();
 let st,deneme='',date='',course='',ev='';
 if(si>=0){st='ok';deneme=String(si+1);date=a[si].d;course=a[si].c;ev=a[si].e;}
 else if(cnt){deneme=cnt+'';course=last.c;ev=last.e;st=cnt>=4||a[3]?'bad':'warn';}else st='none';
 return{k,n,st,deneme,date,course,ev,a};});}
const stLabel={ok:['ok','Hazır'],warn:['warn','Devam ediyor'],bad:['bad','4 denemede başarısız'],none:['mut','Değerlendirilmedi']};
VIEWS.cards=(m,sid)=>{
 const list=sortStudents(activeStudents());
 if(!list.length){noClassMsg(m,'Öğrenci beceri tabloları');return;}
 sid=sid&&stu(sid)?sid:list[0].id;
 m.innerHTML=`<div class="head"><h1>Öğrenci beceri tabloları<span class="clsbadge">${esc(curClass().name)}</span></h1><p>Her öğrencinin 104 beceri için kontrol tablosu; deneme sayısı, hazır olma tarihi ve değerlendiren öğretim elemanı.</p></div>
 <div class="card"><div class="row between"><div class="row"><label class="field" style="min-width:260px">Öğrenci<select id="cs">${list.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.no)} · ${esc(s.name)}</option>`).join('')}</select></label></div>
 <div class="row"><button class="btn" id="cpdf">Beceri kontrol tablosu PDF</button><button class="btn ghost" id="cxl">Sınıfın tümü Excel</button></div></div></div><div id="cbody"></div>`;
 $('#cs').onchange=()=>go('cards',$('#cs').value);
 $('#cpdf').onclick=()=>cardPDF(sid);$('#cxl').onclick=exportAllXLSX;
 const rows=cardRows(sid),done=rows.filter(r=>r.st==='ok'),first=rows.filter(r=>r.a[0]),firstOk=first.filter(r=>r.a[0].r==='+');
 $('#cbody').innerHTML=`<div class="kpis"><div class="kpi"><div class="v">${done.length}/104</div><div class="l">Hazır olunan beceri</div></div>
  <div class="kpi"><div class="v">${rows.filter(r=>r.st==='warn').length}</div><div class="l">Devam eden</div></div>
  <div class="kpi"><div class="v">%${pct(firstOk.length,first.length)}</div><div class="l">İlk deneme başarısı</div></div>
  <div class="kpi"><div class="v">${done.length?(done.reduce((s,r)=>s+ +r.deneme,0)/done.length).toFixed(2):'–'}</div><div class="l">Ort. deneme sayısı</div></div></div>
 <div class="grid2" style="grid-template-columns:minmax(0,2fr) minmax(280px,1fr)">
 <div class="card"><div class="tablewrap" style="max-height:none"><table class="tbl"><thead><tr><th>No</th><th>Beceri</th><th>Denemeler</th><th>Deneme sayısı</th><th>Hazır olma tarihi</th><th>Ders</th><th>Değerlendiren</th><th>Durum</th></tr></thead><tbody>
 ${GROUPS.map(g=>`<tr class="grp"><td colspan="8">Bölüm ${g.id} · ${esc(g.name)}</td></tr>`+rows.filter(r=>r.k>=g.from&&r.k<=g.to).map(r=>`<tr><td>${r.k}</td><td>${esc(r.n)}</td><td style="white-space:nowrap;font-weight:700">${r.a.map(x=>x?`<span style="color:${x.r==='+'?'var(--ok)':'var(--bad)'}">${x.r==='+'?'+':'−'}</span>`:'<span style="color:#ccd">·</span>').join(' ')}</td><td>${r.deneme}</td><td>${fmtDate(r.date)}</td><td>${esc(r.course)}</td><td>${esc(r.ev)}</td><td><span class="chip ${stLabel[r.st][0]}">${stLabel[r.st][1]}</span></td></tr>`).join('')).join('')}
 </tbody></table></div></div>
 <div class="card chartcard" style="align-self:start"><h3>Bölümlere göre ilerleme</h3><div class="chartbox"><canvas id="c-rad"></canvas></div></div></div>`;
 mkChart($('#c-rad'),{type:'radar',data:{labels:GROUPS.map(g=>'B'+g.id),datasets:[{label:'Hazır olunan beceri (%)',data:GROUPS.map(g=>pct(rows.filter(r=>r.k>=g.from&&r.k<=g.to&&r.st==='ok').length,g.to-g.from+1)),backgroundColor:'rgba(14,79,84,.18)',borderColor:COLORS.pri,pointBackgroundColor:COLORS.pri}]},
  options:{scales:{r:{beginAtZero:true,max:100,ticks:{stepSize:25}}},plugins:{tooltip:{callbacks:{title:c=>GROUPS[c[0].dataIndex].name}}}}});
};
async function cardPDF(sid){
 const s=stu(sid),rows=cardRows(sid),items=[];GROUPS.forEach(g=>{items.push({g});rows.filter(r=>r.k>=g.from&&r.k<=g.to).forEach(r=>items.push(r));});
 const pages=chunk(items,36),ra=$('#render-area');overlay(1,'PDF hazırlanıyor…');window.scrollTo(0,0);
 try{ra.innerHTML=pages.map((pg,pi)=>`<div class="card-page"><h2>BECERİ KONTROL TABLOSU</h2><div class="sub">Karamanoğlu Mehmetbey Üniversitesi · Sağlık Hizmetleri MYO · İlk ve Acil Yardım Programı</div>
  ${pi===0?`<div class="info"><div><b>Öğrenci Adı Soyadı:</b> ${esc(s.name)}</div><div><b>Öğrenci No:</b> ${esc(s.no)}</div><div><b>Sınıf / Grup:</b> ${esc(clsName(s.cls))}</div><div><b>Akademik Yıl:</b> ...........................</div><div><b>Öğrenci İmza:</b> ...........................</div><div></div></div>`:`<div class="sub"><b>${esc(s.name)}</b> · ${esc(s.no)}</div>`}
  <table><thead><tr><th style="width:8mm">No</th><th>Beceri Adı</th><th style="width:16mm">Deneme Sayısı</th><th style="width:22mm">Beceriye Hazır Olma Tarihi</th><th style="width:34mm">Değerlendiren Öğretim Elemanı</th><th style="width:18mm">İmza</th></tr></thead><tbody>
  ${pg.map(r=>r.g?`<tr class="g"><td colspan="6">Bölüm ${r.g.id} · ${esc(r.g.name)}</td></tr>`:`<tr><td>${r.k}</td><td>${esc(r.n)}</td><td style="text-align:center">${r.st==='ok'?r.deneme:r.deneme?r.deneme+' (devam)':''}</td><td>${fmtDate(r.date)}</td><td>${r.st==='ok'?esc(r.ev):''}</td><td></td></tr>`).join('')}</tbody></table>
  ${pi===pages.length-1?`<div style="margin-top:6mm;font-size:9pt"><b>GENEL DEĞERLENDİRME VE NOT:</b> Hazır olunan beceri: ${rows.filter(r=>r.st==='ok').length}/104<div style="border:0.3mm solid #000;height:22mm;margin-top:2mm"></div></div>`:''}
  <div class="pn">${pi+1} / ${pages.length}</div></div>`).join('');
  await new Promise(r=>setTimeout(r,60));await elementsToPDF($$('.card-page',ra),'portrait',`Beceri_Kontrol_${safeName(s.no+'_'+s.name)}.pdf`);toast('PDF indirildi');}
 catch(e){console.error(e);toast('PDF oluşturulamadı: '+e.message,1);}finally{ra.innerHTML='';overlay(0);}
}
function exportAllXLSX(){
 if(!needLib('Excel',window.XLSX))return;const wb=XLSX.utils.book_new(),list=sortStudents(activeStudents());
 const m=[['Öğrenci No','Ad Soyad','Hazır (104)',...SKILLS.map((n,i)=>(i+1)+'. '+n)]];
 list.forEach(s=>{const rows=cardRows(s.id);m.push([s.no,s.name,rows.filter(r=>r.st==='ok').length,...rows.map(r=>r.st==='ok'?r.deneme+'. denemede +':r.deneme?r.deneme+' deneme (−)':'')]);});
 const L=[['Öğrenci No','Ad Soyad','Beceri No','Beceri','Deneme','Sonuç','Tarih','Ders','Öğretim Elemanı']];
 list.forEach(s=>Object.entries(DB.records[s.id]||{}).forEach(([k,a])=>a.forEach((x,i)=>{if(x)L.push([s.no,s.name,+k,skillName(+k),i+1,x.r==='+'?'Başarılı (+)':'Başarısız (−)',fmtDate(x.d),x.c,x.e]);})));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(m),'Öğrenci-Beceri Tablosu');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(L),'Tüm Denemeler');
 XLSX.writeFile(wb,`ogrenci_beceri_tablolari_${safeName(clsName(DB.settings.activeClass))}.xlsx`);
}

VIEWS.backup=m=>{
 m.innerHTML=`<div class="head"><h1>Yedekleme</h1><p>${CLOUD?'Veriler Firebase bulutunda tutuluyor ve tüm cihazlarda ortak. Yine de dönem sonlarında yedek dosyası almanız önerilir.':'Tüm veriler bu tarayıcının yerel depolamasında tutulur. Düzenli yedek alın; başka bir bilgisayarda yedeği geri yükleyerek devam edebilirsiniz.'}</p></div>
 <div class="grid2"><div class="card"><h3>Yedek al</h3><p class="mut" style="font-size:13px">Öğrenciler, formlar ve tüm deneme kayıtları tek bir dosyaya kaydedilir.</p><button class="btn" id="bk">Yedek dosyasını indir (.json)</button> <button class="btn ghost" id="bx">Tüm kayıtlar Excel</button></div>
 <div class="card"><h3>Yedekten geri yükle</h3><p class="mut" style="font-size:13px">Mevcut verilerin yerini alır.</p><input type="file" id="rs" accept=".json"></div>
 <div class="card"><h3>Tüm verileri sil</h3><p class="mut" style="font-size:13px">Geri alınamaz. Önce yedek almanız önerilir.</p><button class="btn danger" id="wipe">Tüm verileri sil</button></div></div>`;
 $('#bk').onclick=()=>download(new Blob([JSON.stringify(Object.assign({},DB,{settings:defDB().settings}))],{type:'application/json'}),`iay_beceri_yedek_${todayLocal()}.json`);
 $('#bx').onclick=exportAllXLSX;
 $('#rs').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.students)||!Array.isArray(d.forms))throw new Error('Geçersiz yedek dosyası');
  if(!confirm(`${(d.classes||[]).length||1} sınıf, ${d.students.length} öğrenci ve ${d.forms.length} form içeren yedek yüklensin mi? Mevcut veriler silinir.`))return;
  const keep=DB.settings;if(!CLOUD)localStorage.setItem(KEY,JSON.stringify(d));DB=loadDB(d);if(CLOUD){DB.settings=Object.assign(DB.settings,keep);if(!DB.classes.find(c=>c.id===DB.settings.activeClass))DB.settings.activeClass=DB.classes.length?DB.classes[DB.classes.length-1].id:'';}save();toast('Yedek yüklendi');go('home');}catch(err){toast(err.message,1);}};
 $('#wipe').onclick=()=>{if(confirm('Tüm veriler silinsin mi?')&&confirm('Emin misiniz? Bu işlem geri alınamaz.')){const st=DB.settings;DB=defDB();DB.settings.evaluator=st.evaluator;save();go('home');}};
};
